 на большое количество умеренных или положительных переживаний. Поэтому вопрос заключается не только в том, «сколько хорошего и плохого в среднем», но и в том, имеет ли создатель достаточное основание навязывать конкретному будущему субъекту саму возможность такого проигрыша."}, {"id": "rose_sufferingisnecessary", "cmd": "#sufferingisnecessary", "name": "sufferingisnecessary", "preview": "Утверждение, что страдание необходимо для счастья, требует отдельного доказательства. Даже если некоторые формы трудн...", "text": "Утверждение, что страдание необходимо для счастья, требует отдельного доказательства. Даже если некоторые формы трудностей способствуют определённым достижениям или удовольствиям, из этого не следует, что тяжёлая боль, болезнь, насилие или утрата необходимы в том же смысле. Нужно различать полезные трудности и страдание как самостоятельный отрицательно валентный опыт."}, {"id": "rose_suicide", "cmd": "#suicide", "name": "suicide", "preview": "Из аргумента «создание нового субъекта может быть недопустимо» не следует «существующему человеку следует умереть». П...", "text": "Из аргумента «создание нового субъекта может быть недопустимо» не следует «существующему человеку следует умереть». После рождения ситуация меняется: субъект уже существует, имеет интересы, отношения, планы, страхи и собственное отношение к продолжению жизни. Вопрос о допустимости создания и вопрос о дальнейшей судьбе уже существующего человека требуют разных аргументов."}, {"id": "rose_survivorshipbias", "cmd": "#survivorshipbias", "name": "survivorshipbias", "preview": "Ошибка выжившего возникает, когда вывод о жизни делается преимущественно на основании тех, кто смог продолжить жить и...", "text": "Ошибка выжившего возникает, когда вывод о жизни делается преимущественно на основании тех, кто смог продолжить жить и дать положительную оценку своему существованию. Для полноценной оценки необходимо учитывать и тех, кто испытывает тяжёлое страдание, социальную изоляцию, хроническую боль или другие неблагоприятные состояния."}, {"id": "rose_violence", "cmd": "#violence", "name": "violence", "preview": "*Ненасилие и запрет инструментализации* — отказ от насилия и принуждения в отношении уже существующих людей и животны...", "text": "*Ненасилие и запрет инструментализации* — отказ от насилия и принуждения в отношении уже существующих людей и животных является внутренним логическим ограничением эфилизма, а не внешней дипломатической оговоркой (гл. 31–33, 44, 47, Эпилог). Позиция, которая критикует рождение за одностороннее навязывание тяжёлого риска другому, разрушила бы собственное основание, если бы превратила уже живущих субъектов в расходный материал или средство принудительной реализации своей цели. В Efilism RUS исключены любые призывы к насилию, репродуктивному принуждению или дискриминации.\n\nСм. также: #death #autonomy #extinction #admins"}]}, {"title": "🧬 Биология, наука и ИИ", "items": [{"id": "rose_adaptation", "cmd": "#adaptation", "name": "adaptation", "preview": "*Гедоническая адаптация и аллостаз* — способность организма и психики частично приспосабливаться к изменившимся услов...", "text": "*Гедоническая адаптация и аллостаз* — способность организма и психики частично приспосабливаться к изменившимся условиям и перестраивать рабочие режимы (гл. 18, 26, 34, 36). В биологическом плане длительная вынужденная адаптация создаёт *аллостатическую нагрузку* (накопленный износ регуляторных систем), а в психологическом — автобиографическую реконструкцию прошлого ради сохранения связности «Я». Реальная адаптация помогает уже существующему человеку выдерживать трудности, но не отменяет состоявшийся вред, не спасает при крайних необратимых поражениях и не доказывает, что первоначальное назначение риска было оправдано.\n\nСм. также: #wellbeing #wanting #benefit #suffering"}, {"id": "rose_ai_sentience", "cmd": "#ai_sentience", "name": "ai_sentience", "preview": "*Искусственная сентиентность и граничные сценарии* — поскольку моральная значимость определяется способностью к вален...", "text": "*Искусственная сентиентность и граничные сценарии* — поскольку моральная значимость определяется способностью к валентному переживанию, а не углеродной биологией, возможное создание цифровых или постбиологических чувствующих систем подпадает под тот же этический аудит создания (гл. 20, 33, 45–47; Батлин [S42], Лонг [S43]). Копирование и параллельный запуск искусственного субъекта, способного к отрицательной валентности, создали бы риск масштабирования страдания со скоростью вычислений. Поэтому предохранительная стратегия требует предпочитать *нечувствующие функциональные эквиваленты* там, где сознание не нужно для задачи, а глобальные концепты вроде «терминального стазиса» рассматривать строго как модальные теоретические пределы анализа, а не как готовые технические планы.\n\nСм. также: #technology #sentience #antinatalism #extinction"}, {"id": "rose_biology", "cmd": "#biology", "name": "biology", "preview": "🧬 *Раздел: Причинность, эволюция и дикая природа*  Натуралистический блок книги (Части II, III и X) объясняет, как бе...", "text": "🧬 *Раздел: Причинность, эволюция и дикая природа*\n\nНатуралистический блок книги (Части II, III и X) объясняет, как безличная причинность без замысла и гаранта порождает самоподдерживающуюся организацию, архитектуру нужды и эволюционный отбор.\n\n• *Причинность и воля:* #determinism #freewill #lottery\n• *Репликация, ДНК и отбор:* #evolution #selection #dna #replication #replicationaldelusion #survival\n• *Дикая природа и помощь:* #wildnature #harmreduction\n\nНазад к меню: #nav"}, {"id": "rose_determinism", "cmd": "#determinism", "name": "determinism", "preview": "*Детерминизм и антифатализм* — детерминизм утверждает, что состояния и переходы системы зависят от предшествующей при...", "text": "*Детерминизм и антифатализм* — детерминизм утверждает, что состояния и переходы системы зависят от предшествующей причинной конфигурации и закономерностей мира, а не возникают из беспричинного произвола (гл. 7, 11, 13). В книге детерминизм строго отделяется от *фатализма* (ошибки неподвижной судьбы, будто итог наступит независимо от пути): решения, знания, аргументы, лечение и осторожность сами входят в причинную цепь как реальные промежуточные причины. Именно потому, что мир причинно обусловлен, изменение условий и понимание оснований способны менять будущую траекторию («иные причины — иной исход»).\n\nСм. также: #freewill #biology #metarationality"}, {"id": "rose_digitalimmortality", "cmd": "#digitalimmortality", "name": "digitalimmortality", "preview": "Цифровое бессмертие не следует автоматически считать продолжением субъективного существования конкретного человека. Н...", "text": "Цифровое бессмертие не следует автоматически считать продолжением субъективного существования конкретного человека. Необходимо отдельно обосновать тождество субъекта, сохранение первого лица и непрерывность сознания. Копирование информации о человеке ещё не доказывает, что исходный субъект буквально продолжил своё переживание в цифровой системе."}, {"id": "rose_dna", "cmd": "#dna", "name": "dna", "preview": "ДНК является молекулярным носителем наследственной информации, а не чувствующим субъектом с собственным переживаемым ...", "text": "ДНК является молекулярным носителем наследственной информации, а не чувствующим субъектом с собственным переживаемым благополучием. То, что организмы обладают механизмами, способствующими сохранению и передаче генетической информации, объясняет их репродуктивное поведение, но не устанавливает нормативного требования продолжать размножение. Интересы чувствующего организма и статистический успех передаваемой генетической информации не являются одним и тем же."}, {"id": "rose_evolution", "cmd": "#evolution", "name": "evolution", "preview": "*Эволюция без предвидения и замысла* — историческое изменение наследуемых характеристик популяций под действием мутац...", "text": "*Эволюция без предвидения и замысла* — историческое изменение наследуемых характеристик популяций под действием мутаций, рекомбинации, дрейфа, миграции и отбора (гл. 6, 14–17). Эволюция не является ни светским проектировщиком («мудрой природой»), ни лестницей нравственного прогресса: она закрепляет локальную работоспособность и продолжение наследственных линий без предвидения будущей цены для чувствующих существ. Объяснение эволюционного происхождения признака или репродуктивной мотивации отвечает на причинный вопрос («почему это сохранилось»), но не создаёт нормативной лицензии («почему это следует продолжать»).\n\nСм. также: #selection #biology #wildnature #metarationality"}, {"id": "rose_freewill", "cmd": "#freewill", "name": "freewill", "preview": "*Свобода воли и причинная лотерея* — книга разводит четыре смысла «свободы» (гл. 12): 1) свободу от внешнего принужде...", "text": "*Свобода воли и причинная лотерея* — книга разводит четыре смысла «свободы» (гл. 12): 1) свободу от внешнего принуждения; 2) поведенческую гибкость; 3) рефлексивную функциональную автономию (способность действовать в ответ на понятые основания); 4) *абсолютное самоавторство (causa sui)* — идею, будто субъект сам создал свои исходные свойства, геном, мозг и критерии выбора. Абсолютное самоавторство логически противоречиво (ведёт к бесконечному регрессу самосоздания), а случайное квантовое или нейронное отклонение не добавляет личности контроля. Отказ от causa sui и признание *причинной лотереи* устраняют метафизическую месть и идею абсолютной заслуженности страдания, сохраняя практическую ответственность, защиту и самокоррекцию.\n\nСм. также: #determinism #autonomy #harm"}, {"id": "rose_memetics", "cmd": "#memetics", "name": "memetics", "preview": "🧬 *Почему эволюция НЕ «отсеет» антинатализм (Меметика против ДНК)*  Популярное возражение «антинаталисты не размножаю...", "text": "🧬 *Почему эволюция НЕ «отсеет» антинатализм (Меметика против ДНК)*\n\nПопулярное возражение «антинаталисты не размножаются, поэтому эволюция отсеет их гены и философия вымрет» разрушается по трём основаниям:\n\n1. *Идеи передаются меметически, а не генетически:* мировоззрение не зашито в хромосомах. Ребёнок наталистов не наследует натализм генетически — 100% современных антинаталистов родились у родителей-наталистов. Информация, книги и алгоритмы распространяются через культуру на порядки быстрее биологической смены поколений.\n2. *Натуралистическая ошибка (#natural):* репликация ДНК — такой же слепой физический процесс, как распад урана или кислотные дожди на Венере. То, что процесс «природный», не делает его этичным или обязательным к продолжению.\n3. *Иерархия эволюции:* биологическая репликация — лишь промежуточный этап (номологическая → химическая → биохимическая/ДНК → психологическая/сентиентность → *эпистемическая и метакогнитивная* → *технологическая*). На этапе метакогниции разум обретает способность распознать уязвимость собственной биологической программы и осознанно остановить слепой цикл репликации.\n\nСм. также: #roadmap #dna #evolution #selection #replicationaldelusion"}, {"id": "rose_natural", "cmd": "#natural", "name": "natural", "preview": "Природное происхождение не делает явление автоматически хорошим, полезным или морально оправданным. Боль, болезнь, па...", "text": "Природное происхождение не делает явление автоматически хорошим, полезным или морально оправданным. Боль, болезнь, паразитизм, хищничество, конкуренция и смерть также являются естественными явлениями. Поэтому утверждение «это естественно» объясняет происхождение или распространённость явления, но для нормативного вывода требуется дополнительная посылка о том, почему естественность должна иметь значение для его допустимости."}, {"id": "rose_nociception", "cmd": "#nociception", "name": "nociception", "preview": "*Ноцицепция* — нейронный процесс кодирования и обработки потенциально или фактически повреждающих стимулов (гл. 20, 2...", "text": "*Ноцицепция* — нейронный процесс кодирования и обработки потенциально или фактически повреждающих стимулов (гл. 20, 22). Ноцицепция служит эволюционным и функциональным мостом между повреждением ткани и защитным поведением, но не тождественна самой сознательной боли: рефлекторное отдёргивание или вегетативная реакция могут происходить без осознанного страдания, и наоборот — мучительная нейропатическая или центральная боль способна сохраняться после заживления тканей.\n\nСм. также: #pain #sentience #harm #evolution"}, {"id": "rose_replication", "cmd": "#replication", "name": "replication", "preview": "Репликация — воспроизведение генетической информации или других наследуемых структур. В эволюционном процессе реплика...", "text": "Репликация — воспроизведение генетической информации или других наследуемых структур. В эволюционном процессе репликация имеет причинное значение, поскольку наследуемые варианты, способные воспроизводиться и передаваться, могут становиться более распространёнными. Однако способность системы к самовоспроизведению не является доказательством того, что её продолжение обладает самостоятельной ценностью или отвечает интересам чувствующих субъектов. Репликационная успешность и субъективное благополучие относятся к разным уровням описания."}, {"id": "rose_replicationaldelusion", "cmd": "#replicationaldelusion", "name": "replicationaldelusion", "preview": "Репликационное заблуждение — ошибка, при которой факт самовоспроизведения или эволюционного распространения системы п...", "text": "Репликационное заблуждение — ошибка, при которой факт самовоспроизведения или эволюционного распространения системы принимается за доказательство того, что её продолжение обладает собственной ценностью или должно быть продолжено. Гены и организмы могут быть причинно организованы вокруг воспроизводства, потому что варианты, способствующие собственному распространению, закрепляются эволюцией. Но из того, что механизм стремится или способствует собственной репликации, не следует, что его существование является благом для чувствующего субъекта или что воспроизводство является нормативной обязанностью. Эволюция объясняет, почему репликация продолжается; она не отвечает сама по себе на вопрос, почему её следует продолжать."}, {"id": "rose_selection", "cmd": "#selection", "name": "selection", "preview": "*Естественный отбор и приспособленность* — процесс, при котором наследуемые различия систематически ведут к неодинако...", "text": "*Естественный отбор и приспособленность* — процесс, при котором наследуемые различия систематически ведут к неодинаковому воспроизводству вариантов в следующих поколениях (гл. 16–17). В книге строго разводятся *эволюционная приспособленность* (вклад в продолжение линии) и *благополучие* конкретного организма. В механизме отбора нет канала, вычитающего страдание особи из репродуктивного успеха: мучительные механизмы боли, хронической тревоги, внутривидовой конкуренции, паразитизма и хищничества устойчиво сохраняются, пока они способствуют передаче генетической информации.\n\nСм. также: #evolution #nociception #wildnature #biology"}, {"id": "rose_survival", "cmd": "#survival", "name": "survival", "preview": "Стремление к самосохранению является характерной биологической и психологической особенностью уже существующих органи...", "text": "Стремление к самосохранению является характерной биологической и психологической особенностью уже существующих организмов, но его наличие само по себе не доказывает объективную ценность продолжения жизни. Организм может быть причинно устроен так, чтобы избегать смерти, потому что механизмы самосохранения способствовали выживанию и воспроизводству его предков. Поэтому факт «существующее существо хочет жить» необходимо отличать от нормативного утверждения «существование новых существ должно продолжаться»."}, {"id": "rose_technology", "cmd": "#technology", "name": "technology", "preview": "🤖 *Раздел: Технологии, ИИ и предохранительная стратегия*  Технический прогресс расширяет инструментальную мощность, н...", "text": "🤖 *Раздел: Технологии, ИИ и предохранительная стратегия*\n\nТехнический прогресс расширяет инструментальную мощность, но требует проверки самой цели и отказа от создания новых классов цифровых или постбиологических страдающих субъектов (Часть XII, гл. 45–47).\n\n• *Команды раздела:* #ai_sentience #transhumanism #digitalimmortality #metarationality #extinction\n\nНазад к меню: #nav"}, {"id": "rose_transhumanism", "cmd": "#transhumanism", "name": "transhumanism", "preview": "Трансгуманистическое обещание устранить старение, болезни или другие ограничения не является доказательством того, чт...", "text": "Трансгуманистическое обещание устранить старение, болезни или другие ограничения не является доказательством того, что будущая жизнь обязательно станет безопасной и положительной. Даже радикальное технологическое улучшение требует ответа на вопрос о создании самого субъекта и о рисках, которые сохраняются при его возникновении."}, {"id": "rose_wanting", "cmd": "#wanting", "name": "wanting", "preview": "*«Хотеть», «нравиться» и формирование ставок* — в нейронауке и теории мотивации сила побуждения к цели (wanting / мот...", "text": "*«Хотеть», «нравиться» и формирование ставок* — в нейронауке и теории мотивации сила побуждения к цели (wanting / мотивационный градиент) не равна величине получаемого положительного опыта (liking) и не тождественна оправдывающему основанию (гл. 26, 29, 34; Берридж [S07]). Значительная часть удовольствий работает внутри созданной архитектуры нужд и дефицитов (умеренный и структурный депривационализм), а система вознаграждения постоянно перестраивает мотивационную карту субъекта, превращая ранее нейтральные объекты в новые ставки и новые точки возможной фрустрации или потери.\n\nСм. также: #wellbeing #adaptation #need #metarationality"}, {"id": "rose_wildnature", "cmd": "#wildnature", "name": "wildnature", "preview": "*Дикая природа и фильтр вмешательства* — универсальный сентиоцентризм исключает антропоцентрическую слепоту к страдан...", "text": "*Дикая природа и фильтр вмешательства* — универсальный сентиоцентризм исключает антропоцентрическую слепоту к страданиям диких животных (Часть X, гл. 39–40). Экосистема или вид не являются единым чувствующим существом: экологическое равновесие и высокая численность популяции совместимы с массовой болезненной гибелью молодняка, голодом, паразитизмом и хищничеством. При этом признание природного вреда не разрешает инженерную самоуверенность: любое вмешательство ради помощи должно проходить строгий *причинный фильтр* (ясность механизма, учёт обратных связей, отсутствие переноса большего вреда, мониторинг и *остановимость*), начиная с прекращения антропогенного вреда и адресных обратимых мер.\n\nСм. также: #evolution #selection #sentience #biology"}]}, {"title": "🛠 Администрирование и дебаты", "items": [{"id": "rose_adhominem", "cmd": "#adhominem", "name": "adhominem", "preview": "Переход на личность не устанавливает истинность или ложность рассматриваемого тезиса. Психологическое состояние, хара...", "text": "Переход на личность не устанавливает истинность или ложность рассматриваемого тезиса. Психологическое состояние, характер, биография, репутация или личные мотивы сторонника эфилизма могут быть предметом отдельного разговора, но сами по себе не опровергают его аргумент. Если утверждается, что позиция возникла из депрессии, травмы или неудовлетворённости жизнью, необходимо дополнительно показать ошибочность самого аргумента. Причина, по которой человек пришёл к убеждению, и истинность этого убеждения являются разными вопросами."}, {"id": "rose_admins", "cmd": "#admins", "name": "admins", "preview": "👤 *Администрация и принципы дискуссии Efilism RUS*  В сообществе приветствуется аргументированный разбор позиций, воп...", "text": "👤 *Администрация и принципы дискуссии Efilism RUS*\n\nВ сообществе приветствуется аргументированный разбор позиций, вопросы по существу и проверка конкретных посылок (#criticism #steelman #field_method). Переход на личности (#adhominem), оскорбления, спам и любые призывы к насилию (#violence) пресекаются модерацией.\n\n• Актуальный список администраторов: `/adminlist`\n• Правила сообщества: `/rules`\n• Полная навигация по базе знаний: #nav"}, {"id": "rose_adminset", "cmd": "#adminset", "name": "adminset", "preview": "{admin} ⚙️ *Шпаргалка администратора Efilism RUS (часть 2 — настройки Rose)*  📚 *Заметки и фильтры:* • `/save <имя> <...", "text": "{admin} ⚙️ *Шпаргалка администратора Efilism RUS (часть 2 — настройки Rose)*\n\n📚 *Заметки и фильтры:*\n• `/save <имя> <текст>` — сохранить заметку (`#имя` или `/get имя`)\n• `/clear <имя>` — удалить заметку (`/notes` — список всех заметок)\n• `/privatenotes off` — выдавать заметки прямо в чат (или `on` — в ЛС)\n• `/filter <слово> <ответ>` / `/stop <слово>` — автоответчик (`/filters`)\n\n🔒 *Блокировки и антифлуд:*\n• `/lock <тип>` / `/unlock <тип>` — закрыть/открыть тип контента (`/locks`, `/locktypes`)\n• `/allowlist <ссылка/@канал>` / `/rmallowlist` — белый список\n• `/setflood 7` / `/setfloodmode tmute 1h` — лимит сообщений подряд (`/flood`)\n• `/warnlimit 3` / `/warnmode tmute 24h` — наказание за лимит варнов\n\n🧹 *Чистота чата и правила:*\n• `/setrules <текст>` — задать правила (`/rules`)\n• `/setwelcome <текст>` — задать приветствие (`/welcome on`)\n• `/cleancommand notes on` — автоудаление команд вызова\n• `/cleanservice on` — автоудаление плашек о входе/выходе\n\nКоманды наказаний: #modhelp"}, {"id": "rose_criticism", "cmd": "#criticism", "name": "criticism", "preview": "*Открытый стандарт, фаллибилизм и условия пересмотра* — в книге «Эфилизм» (Введение; гл. 1–4, 48) система строится на...", "text": "*Открытый стандарт, фаллибилизм и условия пересмотра* — в книге «Эфилизм» (Введение; гл. 1–4, 48) система строится на принципах *фаллибилистского реализма*, *эпистемической симметрии* и *предела вывода*. Сомнение используется как адресный инструмент проверки конкретного звена, а не как бесконечная отсрочка («а вдруг»). К эфилизму и натализму применяются одинаковые требования доказательности: неизвестность не является лицензией на риск, голая логическая возможность не равна основанию, а объяснение происхождения мотива не равно его оправданию. Центральный вывод книги подлежит пересмотру, если будет опровергнута хотя бы одна из его несущих посылок: реальность отрицательно валентного вреда, отсутствие предшествующего нуждающегося до создания, сохранение защищённого риска крайнего вреда либо отсутствие независимого канала нормативной авторизации.\n\nСм. также: #steelman #field_method #core #book"}, {"id": "rose_fakes", "cmd": "#fakes", "name": "fakes", "preview": "🛡 *Разбор частых мифов и вбросов об эфилизме*  1. *«Эфилизм призывает к насилию или прославляет смерть».* Ложь. В Efi...", "text": "🛡 *Разбор частых мифов и вбросов об эфилизме*\n\n1. *«Эфилизм призывает к насилию или прославляет смерть».*\nЛожь. В Efilism RUS безусловно закреплён принцип ненасилия и защиты телесной автономии уже живущих (#violence #death #promortalism). Отказ от создания новых уязвимых субъектов не имеет ничего общего с агрессией к живущим.\n\n2. *«Эфилисты ненавидят жизнь и людей».*\nНаоборот: позиция строится на серьёзном отношении к чужой боли и эмпатии к уже существующим людям и животным (#wellbeing #core).\n\n3. *«Вырванные цитаты и личные слухи в интернете доказывают неправоту идеи».*\nАргументы проверяются логикой и фактами, а не сплетнями (#adhominem #steelman).\n\n🔎 Подробный разбор всех 55 вопросов и мифов:\nhttps://bohdan19p-bit.github.io/efilism-faq/\nДисклеймер проекта: https://ruslanmalovanyiblog.wordpress.com/disclaimerfaq/"}, {"id": "rose_field_method", "cmd": "#field_method", "name": "field_method", "preview": "*Полевой метод эфилистического анализа* — воспроизводимый протокол разбора любого аргумента в споре без карикатуризац...", "text": "*Полевой метод эфилистического анализа* — воспроизводимый протокол разбора любого аргумента в споре без карикатуризации и смены темы (гл. 48, Приложение B):\n\n1. *Разделить реплику и зафиксировать тезис:* что именно довод пытается доказать (возможность хорошей жизни или разрешение назначить риск)?\n2. *Определить функцию и время:* описывает ли довод мотив родителя, благо после создания или основание до создания?\n3. *Развести роли:* кто принимает решение, кто получает благо и кто несёт необратимый риск?\n4. *Проверить нормативный мост:* какой принцип превращает ожидаемое благо в полномочие конституировать носителя защищённого риска?\n5. *Назвать цель возражения:* какую именно посылку минимального ядра (#core) снимает довод? Если факт верный («в жизни есть любовь»), но ни одну посылку ядра не опровергает — признать факт и вернуть разговор к пропущенному переходу.\n\nСм. также: #steelman #criticism #objections #core"}, {"id": "rose_modhelp", "cmd": "#modhelp", "name": "modhelp", "preview": "{admin} 🛠 *Панель администратора Efilism RUS (Rose Bot)* _Нажмите на любую команду в плашке — она сразу скопируется в...", "text": "{admin} 🛠 *Панель администратора Efilism RUS (Rose Bot)*\n_Нажмите на любую команду в плашке — она сразу скопируется в буфер обмена._\n\n🛡 *Предупреждения (лимит — 3 варна):*\n• `/warn` — выдать варн (по реплаю или `@username причина`)\n• `/dwarn` — удалить сообщение + выдать варн\n• `/rmwarn` — снять последний варн\n• `/resetwarn` — обнулить все варны участника\n• `/warns` — проверить список варнов\n\n🔇 *Муты (ограничение чата):*\n• `/tmute 1h` — мут на 1 час (остудить спор)\n• `/tmute 6h` · `/tmute 12h` · `/tmute 24h` · `/tmute 3d` — временный мут\n• `/mute` — бессрочный мут\n• `/unmute` — снять мут\n\n🔨 *Баны и исключение:*\n• `/kick` — кикнуть из чата (без бана, может перезайти)\n• `/tban 7d` — временный бан на 7 дней\n• `/ban` — бессрочный бан (по реплаю или ID)\n• `/dban` — удалить сообщение + забанить автора\n• `/unban` — разбанить участника\n\n🧹 *Очистка сообщений:*\n• `/del` — удалить сообщение по реплаю\n• `/purge` — удалить все сообщения от реплая до конца\n• `/purge 10` — удалить 10 сообщений начиная с реплая\n\n📚 *Управление базой знаний (заметки):*\n• `/save имя текст` — создать или обновить карточку `#имя`\n• `/clear имя` — удалить карточку\n• `/notes` — список всех карточек базы\n• `/privatenotes off` — выдавать карточки прямо в тему чата (`on` — в ЛС)\n\n🤖 *Автоответчик (фильтры) и блокировки:*\n• `/filter слово ответ` — создать автоответ (`/stop слово` — удалить, `/filters` — список)\n• `/lock тип` / `/unlock тип` — закрыть/открыть медиа или ссылки (`/locks`, `/locktypes`)\n• `/allowlist @канал` — разрешить репосты/ссылки (`/rmallowlist` — убрать)\n\n⚙️ *Быстрые настройки и инфо:*\n• `/id` — узнать ID чата или пользователя (по реплаю)\n• `/info` — карточка профиля и статуса пользователя\n• `/adminlist` — список админов · `/rules` — правила (`/setrules текст`)\n• `/setflood 7` и `/setfloodmode tmute 1h` — защита от спама (`/flood`)"}, {"id": "rose_scarecrow", "cmd": "#scarecrow", "name": "scarecrow", "preview": "Подмена тезиса заключается в том, что вместо реального аргумента оппонента создаётся более слабая или абсурдная верси...", "text": "Подмена тезиса заключается в том, что вместо реального аргумента оппонента создаётся более слабая или абсурдная версия, после чего опровергается уже она. Например, утверждение «рождение создаёт риск страдания» нельзя заменить на «антинаталисты считают, что жизнь состоит только из страдания», а затем считать исходный аргумент опровергнутым."}, {"id": "rose_steelman", "cmd": "#steelman", "name": "steelman", "preview": "Стальной человек — принцип критики, согласно которому перед возражением следует сформулировать позицию оппонента в ма...", "text": "Стальной человек — принцип критики, согласно которому перед возражением следует сформулировать позицию оппонента в максимально сильной версии, совместимой с тем, что он действительно утверждает. Это означает не просто повторить его слова, а устранить очевидные недоразумения и выбрать наиболее защищаемую интерпретацию аргумента. После этого критика становится содержательной: если даже сильная версия не выдерживает возражения, результат имеет большее доказательное значение."}]}], "faq": [{"title": "Раздел 1. Основы, терминология и границы понятия", "items": [{"id": "faq_1", "num": "1", "anchor": "q-1", "q": "Вопрос 1. Что такое эфилизм и откуда взялось это название? Ссылка", "a": "Эфилизм (англ. efilism — слово «life», прочитанное задом наперёд) — это философская позиция абсолютного сентиоцентрического антинатализма. В её центре лежит вывод о том, что воспроизводство чувствующей жизни, способной испытывать боль и страдание, этически недопустимо и должно быть прекращено максимально мягким, ненасильственным и разумным путём.\n\nТермин ввёл на YouTube философ-пессимист Гэри (Inmendham), чтобы отделить сентиоцентрический подход (охватывающий всех чувствующих существ — и людей, и животных) от узкого антропоцентричного антинатализма и от ценностного нигилизма. В систематической монографии «Эфилизм: Философия абсолютного антинатализма» (2026) эта позиция переведена из устной полемики в строгую дедуктивно-эмпирическую систему.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-1"}, {"id": "faq_2", "num": "2", "anchor": "q-2", "q": "Вопрос 2. Чем эфилизм отличается от обычного антинатализма, чайлдфри и VHEMT? Ссылка", "a": "Чайлдфри — это личный жизненный выбор не заводить детей (по бытовым, финансовым или карьерным причинам), не содержащий универсального этического суждения о воспроизводстве жизни.\n\nКлассический (антропоцентричный) антинатализм признаёт неэтичным рождение новых людей, но на практике часто игнорирует страдания диких животных. Движение за добровольное вымирание человечества (VHEMT, основано Лесом Найтом в 1991 году) и вовсе призывает людей исчезнуть «ради сохранения и процветания дикой природы».\n\nЭфилизм отвергает романтизацию дикой природы: если боль морально значима сама по себе, уход одного лишь человечества оставляет триллионы диких животных в вечной мясорубке естественного отбора. Поэтому эфилизм распространяет антинаталистический принцип на всю чувствующую биосферу.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-2"}, {"id": "faq_3", "num": "3", "anchor": "q-3", "q": "Вопрос 3. Правда ли, что эфилизм — это «ненависть к людям» (мизантропия) или «культ смерти»? Ссылка", "a": "Нет, это прямое искажение смысла. Мизантроп ненавидит людей как вид и нередко идеализирует «чистую природу». Эфилизм, напротив, исходит из сострадания ко всем чувствующим существам — и людям, и животным — как к уязвимым жертвам слепого эволюционного механизма.\n\nЭфилизм также не является «культом смерти»: сама смерть и процесс умирания оцениваются в нём резко отрицательно. Главный тезис состоит не в том, что «умирать хорошо», а в том, что «лучше не запускать новую жизнь, обречённую на болезни, старение и смерть».", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-3"}, {"id": "faq_4", "num": "4", "anchor": "q-4", "q": "Вопрос 4. Какова роль Гэри (Inmendham) в эфилизме, и чем систематический эфилизм (монография 2026 года) отличается от устной полемики? Ссылка", "a": "Гэри (Inmendham) — создатель термина и автор многолетнего видеоархива, сформулировавший ключевые интуиции эфилизма: сентиоцентризм, критику дикой природы, образ «архитектуры нужды» и требование честной оценки итогового баланса жизни.\n\nВ монографии 2026 года проведена строгая трёхслойная демаркация: первичная устная полемика Гэри и промежуточные интернет-компиляции отделены от академически выверенной философской реконструкции. Систематический эфилизм сохраняет сентиоцентрическое этическое ядро, но очищает его от частных спорных гипотез (например, нестандартных взглядов Гэри на квантовую физику или климатологию) и от излишне резкой риторики.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-4"}, {"id": "faq_5", "num": "5", "anchor": "q-5", "q": "Вопрос 5. Что такое «Минимальное этическое ядро» эфилизма? Обязательно ли быть физикалистом и детерминистом, чтобы его принять? Ссылка", "a": "Нет, не обязательно. Монография (гл. 32.4) построена модульно: её «Минимальное этическое ядро» состоит всего из четырёх проверяемых посылок, для принятия которых не требуется разделять специфическую онтологию физикализма или жёсткого детерминизма.\n\nДостаточно признать четыре факта: (1) до создания нового субъекта не существует его предсуществующей нужды в бытии; (2) любое биологическое рождение сопряжено с неустранимым риском тяжёлых, некомпенсируемых страданий; (3) невозможно получить предварительное согласие создаваемого существа; (4) недопустимо навязывать третьему лицу такой риск ради ожидаемых благ или интересов уже живущих. Из этих посылок следует запрет на воспроизводство.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-5"}, {"id": "faq_6", "num": "6", "anchor": "q-6", "q": "Вопрос 6. Почему эфилизм говорит именно о чувствующей (сентиентной) жизни, а не о бактериях, растениях или вирусах? Ссылка", "a": "Потому что объективный вред и благо возникают только там, где есть субъективный опыт (способность переживать боль, страх, дискомфорт или облегчение). Повреждение камня, компьютерной платы, вируса, бактерии или растения — это физическое или биохимическое событие, но не страдание: внутри них некому переживать «мне плохо».\n\nВ полемике с Каримом Акермой и сторонниками «чувствующей клетки» (А. Ребер) и Гэри, и монография (гл. 19–22) чётко разграничивают простую химическую реакцию на стимул и нейронную сентиентность. Нечувствующая ДНК (бактерии, растения) интересует эфилизм лишь инструментально — как возможная база для повторной эволюции нервных систем в далёком будущем.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-6"}, {"id": "faq_7", "num": "7", "anchor": "q-7", "q": "Вопрос 7. Не является ли сам термин «эфилизм» избыточным или «испорченным» в интернете? Ссылка", "a": "Часть критиков (например, Фернандо Ольшевский или анонимные авторы на Reddit) утверждает, что достаточно говорить о «философском пессимизме» или «антинатализме». Однако на практике оба этих термина слишком размыты: пессимизм часто ограничивается созерцательной меланхолией, а мейнстримный антинатализм сводится к отказу от рождения людей при равнодушии к дикой природе.\n\nТермин «эфилизм» выполняет точную аналитическую функцию — он фиксирует универсальный сентиоцентрический антинатализм без видовых исключений. В академической среде его синонимом выступает термин «абсолютный сентиоцентрический антинатализм», но сама суть позиции от смены ярлыка не меняется.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-7"}]}, {"title": "Раздел 2. Биология, эволюция и природа страдания", "items": [{"id": "faq_8", "num": "8", "anchor": "q-8", "q": "Вопрос 8. Почему эфилизм называет эволюцию и ДНК «первичной проблемной архитектурой»? Ссылка", "a": "Потому что молекула ДНК и естественный отбор не имеют цели сделать живые существа счастливыми. Единственный критерий отбора — устойчивое копирование генов. Боль, голод, страх, тревога и болезни закрепились в эволюции именно потому, что они эффективно заставляют организм выживать и размножаться, не заботясь о его благополучии.\n\nВ монографии (гл. 16–24) показано: пока работает биологический конвейер репликации, проблема страдания не является временной «неисправностью» — она встроена в саму архитектуру живой материи.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-8"}, {"id": "faq_9", "num": "9", "anchor": "q-9", "q": "Вопрос 9. Что такое «архитектура нужды» и почему удовольствия не перекрывают страдания? Ссылка", "a": "Живой организм — это открытая система, постоянно требующая энергии, защиты и регуляции. Чтобы заставить его поддерживать себя, нервная система генерирует непрерывный поток дефицитов: голод, жажду, усталость, холод, одиночество, скуку и физическую боль. В архиве Гэри это наглядно описано «аргументом кнута»: подавляющее большинство удовольствий — это временное ослабление заранее созданного дискомфорта.\n\nДаже если признать самостоятельный позитивный характер отдельных радостей (как уточняется в монографии, гл. 26, и в выпуске Гэри WTF #980), структура переживаний глубоко асимметрична: потолок удовольствия краток и ограничен адаптацией, тогда как глубина и длительность страданий (хроническая боль, онкология, деменция, насильственная гибель) несоизмеримо велики.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-9"}, {"id": "faq_10", "num": "10", "anchor": "q-10", "q": "Вопрос 10. Что такое «реальный вред» и как нейрофеноменология обосновывает его существование? Ссылка", "a": "Эфилизм опирается на нейрофеноменологический реализм: вред не является произвольной языковой выдумкой или «просто мнением». В нервной системе чувствующего существа ноцицепция и сопутствующие нейрофизиологические процессы выступают физическим субстратом, отрицательная валентность — непосредственным переживаемым качеством вреда, а феноменальная прозрачность нервной системы (термин нейрофилософа Томаса Метцингера) объясняет, почему это состояние переживается субъектом как несомненная, неотменимая реальность.\n\nДаже если вы знаете, что боль кодируется электрическими импульсами в мозге, само это знание не отменяет её жгучей непосредственности. Именно эта неустранимая отрицательная валентность переживания служит объективным эмпирическим якорем для всей аксиологии эфилизма.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-10"}, {"id": "faq_11", "num": "11", "anchor": "q-11", "q": "Вопрос 11. Отрицает ли эфилизм реальность радости, любви, красоты и смысла жизни? Ссылка", "a": "Нет. Систематический эфилизм не утверждает, что в жизни нет подлинной радости, искусства, дружбы или любви (монография, гл. 26 и 38). Вопрос стоит иначе: имеет ли кто-либо моральное право покупать ожидаемую радость одного существа ценой несогласованного риска тяжёлого вреда для него же или для других существ?\n\nРадость имеет ценность для уже живущего человека, помогая ему достойно и с меньшей болью прожить отпущенный срок. Но нерождённый субъект не нуждается в радости и не страдает от её отсутствия.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-11"}, {"id": "faq_12", "num": "12", "anchor": "q-12", "q": "Вопрос 12. Разве эволюция не стремится к гармонии, балансу и «выживанию лучшего»? Ссылка", "a": "Представление о «гармонии природы» — иллюзия наблюдателя. В дикой природе преобладает так называемый r-отбор: огромное большинство видов производит десятки, сотни или тысячи детёнышей, из которых до взрослого возраста доживают единицы. Остальные быстро погибают от голода, холода, паразитов и хищников.\n\nВидимое «равновесие» экосистем поддерживается только тем, что падальщики и хищники мгновенно утилизируют тела погибших животных, скрывая масштаб ежедневной гибели от человеческого взгляда.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-12"}, {"id": "faq_13", "num": "13", "anchor": "q-13", "q": "Вопрос 13. Как эфилизм относится к идее, что «страдание закаляет и делает человека сильнее»? Ссылка", "a": "Это классическая психологическая рационализация (ошибка выжившего). Небольшие трудности действительно могут учить навыкам адаптации внутри уже начавшейся жизни, но крайние страдания — неизлечимые болезни, пытки, тяжёлые травмы, гибель близких — никого не «закаляют», а ломают и уничтожают психику и тело.\n\nКроме того, «закалка» нужна лишь для того, чтобы выдерживать новые удары той же самой враждебной среды. Создавать нового человека ради того, чтобы он «героически преодолевал» созданные для него проблемы, логически несостоятельно.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-13"}, {"id": "faq_14", "num": "14", "anchor": "q-14", "q": "Вопрос 14. Почему нельзя считать «среднюю» жизнь «достаточно хорошей» для оправдания рождения? Ссылка", "a": "Во-первых, самооценка «средней» жизни систематически завышена психологическими защитными механизмами. Во-вторых, при рождении ребёнка родители не гарантируют ему «средний» исход — они запускают причинную лотерею, в которой всегда присутствует ненулевая вероятность катастрофического исхода (тяжёлая генетическая патология, психическое расстройство, насилие, мучительная смерть).\n\nВ-третьих, даже благополучная человеческая биография оплачивается косвенным вредом (потреблением ресурсов, эксплуатацией животных) и неизбежно завершается старением, утратами и умиранием.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-14"}, {"id": "faq_15", "num": "15", "anchor": "q-15", "q": "Вопрос 15. Что такое психологическая защита продолжения (эффект Поллианны, когнитивное искажение оптимизма)? Ссылка", "a": "Эволюция отобрала мозги, склонные преуменьшать прошлую боль, вытеснять страх смерти и переоценивать шансы на успех — иначе организм терял бы мотивацию действовать и размножаться. В психологии это описывается как эффект Поллианны, когнитивное искажение оптимизма и гедоническая адаптация (подробно разобрано в книге Дэвида Бенатара и в гл. 34 монографии).\n\nИз-за этих встроенных фильтров люди искренне оценивают свою жизнь намного выше, чем показывает объективный учёт их ежедневного дискомфорта, болезней, тревог и нереализованных желаний.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-15"}]}, {"title": "Раздел 3. Этика создания: согласие, риск и асимметрия", "items": [{"id": "faq_16", "num": "16", "anchor": "q-16", "q": "Вопрос 16. Как устроен аргумент об отсутствии согласия на рождение? Ведь у несуществующего нет прав и желаний! Ссылка", "a": "Критики часто возражают: «Невозможно спросить согласия у того, кого нет, значит, аргумент бессмыслен». Но в этике невозможность получить согласие никогда не превращается в разрешение на опасное вмешательство.\n\nЕсли человек без сознания, мы вправе вмешаться без его согласия только для того, чтобы спасти его от уже грозящего вреда (например, провести экстренную операцию), но не для того, чтобы вовлечь его в рискованную азартную игру ради возможного выигрыша. До зачатия нет никакой беды, от которой нужно «спасать» нерождённого, поэтому невозможность согласия выступает строгим запретом, а не лазейкой.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-16"}, {"id": "faq_17", "num": "17", "anchor": "q-17", "q": "Вопрос 17. Что такое «принцип антижертвенного защитного порога» и «конститутивный риск»? Ссылка", "a": "Это несущая этическая конструкция систематического эфилизма (монография, гл. 31–33). Конститутивный риск — это риск тяжёлого и необратимого вреда, который нельзя отделить от самого факта создания биологического субъекта: вы не можете «выключить» уязвимость к боли, болезням и смерти до рождения.\n\nПринцип антижертвенного защитного порога гласит: в отсутствие предсуществующей нужды и предварительного согласия категорически недопустимо создавать нового носителя конститутивного риска ради ожидаемых будущих благ. Ничьё ожидаемое удовольствие не даёт права приносить другого субъекта в потенциальную жертву.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-17"}, {"id": "faq_18", "num": "18", "anchor": "q-18", "q": "Вопрос 18. Зависит ли эфилизм от аксиологической асимметрии Дэвида Бенатара? Что, если четвёртый квадрант Бенатара ошибочен? Ссылка", "a": "Нет, не зависит. Четвёртый квадрант Бенатара («отсутствие удовольствия в небытии не плохо, если нет субъекта, который был бы его лишён») — самая оспариваемая часть его книги Better Never to Have Been (2006). Критики указывают, что Бенатар не даёт независимого дедуктивного доказательства «аргумента депривации» и смешивает аксиологические оценки с деонтологическими обязанностями.\n\nСистематический эфилизм полностью устойчив к падению асимметрии Бенатара: он строит запрет на воспроизводство напрямую на деонтологическом уровне — через отсутствие предсуществующей нужды и недопустимость навязывания конститутивного риска, не нуждаясь в спорных сравнениях «небытия с бытием».", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-18"}, {"id": "faq_19", "num": "19", "anchor": "q-19", "q": "Вопрос 19. Как ответить на возражение об «ошибке четырёх терминов» (небытие = Null, значит, с бытием его якобы нельзя сравнивать)? Ссылка", "a": "В дискуссиях (в частности, на r/DebateAVegan в декабре 2025 года) звучит довод: «Не страдать» — это состояние живого мозга, а небытие равно Null, поэтому нельзя сказать, что нерождённому «лучше не родиться».\n\nЭто возражение опровергается двумя способами. Во-первых, сведением к абсурду: если бытие и небытие абсолютно несравнимы из-за статуса Null, то намеренное создание ребёнка, обречённого на непрерывные пытки с рождения до смерти, пришлось бы объявить морально нейтральным. Во-вторых, эфилизм оценивает не «выгоду несуществующего», а допустимость действия уже существующего агента: запускать ли новый уязвимый носитель боли там, где до этого нет никакой проблемы.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-19"}, {"id": "faq_20", "num": "20", "anchor": "q-20", "q": "Вопрос 20. А если создать гипотетическое «всемогущее безболезненное существо» или идеальную жизнь без боли? Ссылка", "a": "Этот мысленный эксперимент бьёт по схеме Бенатара (которая вынуждена объявлять безграничное чистое счастье бесполезным), но совершенно не затрагивает систематический эфилизм.\n\nВ монографии (гл. 33.1) прямо зафиксировано: в гипотетической системе, где отрицательная валентность, уязвимость и вред физически невозможны, запрет по конститутивному риску просто не активируется. Однако в реальной биологической Вселенной размножение никогда не порождает неуязвимых безболезненных богов — оно воспроизводит хрупкие организмы, гарантированно подверженные страданию и распаду.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-20"}, {"id": "faq_21", "num": "21", "anchor": "q-21", "q": "Вопрос 21. Но ведь большинство людей говорят, что рады, что родились! Разве ретроспективное согласие не оправдывает рождение? Ссылка", "a": "Нет, по двум причинам. Во-первых, с точки зрения логики и права последующее одобрение удачного исхода не оправдывает исходную рискованную ставку чужим благополучием: если кто-то без разрешения сыграл в русскую рулетку с чужой головой и выстрела не произошло, а жертва потом сказала «ну, обошлось», сам поступок не становится этичным.\n\nВо-вторых, родители заранее не знают, окажется ли их конкретный ребёнок среди тех, кто «рад», или среди тех, чья жизнь превратится в кошмар. Выигрыш одних людей не компенсирует сломанную судьбу других.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-21"}, {"id": "faq_22", "num": "22", "anchor": "q-22", "q": "Вопрос 22. Неужели даже в любящей, обеспеченной и безопасной семье рождать детей неэтично? Ссылка", "a": "Хорошие родители действительно снижают часть социальных рисков, но они не способны устранить конститутивный риск биологического существования. Никакое богатство и никакая любовь не страхуют от онкологии, нейродегенерации, тяжёлой депрессии, несчастных случаев, войн, потери близких и неизбежного старения.\n\nПоэтому любовь и забота являются безусловным долгом перед уже рождёнными детьми, но не могут служить гарантией безопасности для создания нового человека.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-22"}, {"id": "faq_23", "num": "23", "anchor": "q-23", "q": "Вопрос 23. Почему «даже если риск невелик, шанс на счастье стоит ставки» — логическая ошибка? Ссылка", "a": "Эта логика работает только тогда, когда вы ставите на кон собственные интересы ради собственной выгоды. При рождении ребёнка вы делаете ставку, в которой потенциальный проигрыш (боль, болезнь, страх, смерть) полностью ложится на другого субъекта, который никогда не просил делать эту ставку и не испытывал никакой нехватки счастья до рождения.\n\nАсимметрия ставок очевидна: если не играть, никто ничего не теряет; если сыграть, появляется реальный риск необратимой катастрофы для живого существа.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-23"}]}, {"title": "Раздел 4. Дикая природа, животные и веганство", "items": [{"id": "faq_24", "num": "24", "anchor": "q-24", "q": "Вопрос 24. Почему эфилизм уделяет столько внимания дикой природе («слон и блоха»)? Ссылка", "a": "По масштабу численности и интенсивности страданий человечество составляет крошечную долю чувствующей биосферы. По яркому образу Гэри (Inmendham), если совокупное страдание на Земле — это огромный слон, то человеческие проблемы — лишь блоха на его спине, а сам слон — это триллионы диких млекопитающих, птиц, рептилий, рыб и иных чувствующих организмов.\n\nПоследовательная этика, признающая объективную значимость боли, не имеет права проводить произвольную границу по биологическому виду (видовая дискриминация / специесизм).", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-24"}, {"id": "faq_25", "num": "25", "anchor": "q-25", "q": "Вопрос 25. Разве дикая природа — не прекрасная, гармоничная и «естественная» среда, куда человеку нельзя вмешиваться? Ссылка", "a": "Отождествление «естественного» с «хорошим» — классическая натуралистическая ошибка (нарушение принципа Юма). В природе одинаково «естественны» малярия, бешенство, поедание жертвы заживо хищниками, паразиты, выедающие глаза изнутри, лесные пожары и массовая гибель детёнышей от голода.\n\nВся человеческая медицина и этика существуют именно для того, чтобы противостоять слепой жестокости природы. В монографии (гл. 39–40) подчёркивается: дикая природа нуждается не в романтизации, а в трезвой научной оценке без инженерной самоуверенности.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-25"}, {"id": "faq_26", "num": "26", "anchor": "q-26", "q": "Вопрос 26. Что такое «бремя интеллекта» и почему аргумент Бенатара о том, что «животные не моральные агенты», не снимает ответственности с человека? Ссылка", "a": "Дэвид Бенатар в интервью объясняет своё невмешательство в дикую природу тем, что животные не являются моральными агентами и «не совершают морального проступка», размножаясь. Но как справедливо возражает Гэри (в выпусках WTF #892 и WTF #970), отсутствие морального агентства никогда не отменяет обязанности помочь жертве или остановить вред.\n\nЕсли маленький ребёнок или невменяемый человек не понимает последствий своих действий, это не повод бросить их на произвол судьбы — наоборот, именно наличие разума и способности просчитывать последствия возлагает на человечество «бремя интеллекта» (ответственность наиболее компетентного субъекта).", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-26"}, {"id": "faq_27", "num": "27", "anchor": "q-27", "q": "Вопрос 27. Как эфилизм относится к веганству и почему Гэри критикует «религиозный веганизм»? Ссылка", "a": "Эфилизм полностью поддерживает отказ от эксплуатации и убийства животных (в том числе растительное питание как способ не финансировать животноводство). Ни один последовательный сентиоцентрист не может оправдывать промышленные бойни ради вкусового комфорта.\n\nВместе с тем Гэри критикует превращение веганства в «религиозный культ личной чистоты» — когда человек носит свою диету как медаль за героизм, травит других за бытовые слабости и при этом закрывает глаза на то, что промышленное животноводство — лишь часть гораздо более масштабной трагедии воспроизводства жизни и дикой природы.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-27"}, {"id": "faq_28", "num": "28", "anchor": "q-28", "q": "Вопрос 28. Как быть с дилеммой содержания домашних хищников (например, кошек)? Призывает ли эфилизм «усыплять домашних животных»? Ссылка", "a": "Систематический эфилизм категорически не призывает к жестокому обращению или произвольному умерщвлению домашних животных. Вместе с тем он честно признаёт реальную этическую дилемму, известную в академической биоэтике: содержание облигатного хищника на коммерческом мясном корме на протяжении 15 лет косвенно оплачивает забой сотен других чувствующих животных.\n\nИменно поэтому скандальные ролики вроде видео The Internet Investigator (2026) манипулируют зрителем, объявляя саму постановку этой дилеммы «безумием». Зрелый подход эфилизма включает: (1) жёсткий запрет на разведение и покупку новых питомцев у заводчиков; (2) обязательную стерилизацию существующих животных; (3) ответственное исследование безопасных синтетических/растительных альтернатив корма без жестоких экспериментов и уважение к благополучию уже живущих подопечных.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-28"}, {"id": "faq_29", "num": "29", "anchor": "q-29", "q": "Вопрос 29. Если вымрет только человечество (сценарий VHEMT), станет ли на Земле меньше страданий? Ссылка", "a": "Нет, а с высокой вероятностью совокупный объём страданий даже вырастет. После исчезновения городов, дорог, пашен и инфраструктуры дикая биосфера быстро восстановит плотность популяций на освоенных территориях, увеличив число диких животных, обречённых на хищничество, паразитов и голод на сотни миллионов лет вперёд.\n\nБолее того, уход единственного разумного вида навсегда лишает планету единственного агента, потенциально способного осознать масштаб биосферного страдания и искать гуманные пути его снижения.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-29"}, {"id": "faq_30", "num": "30", "anchor": "q-30", "q": "Вопрос 30. Что такое парадокс сентиоцентрического антинатализма (Масахиро Мориока, 2026) — нужно ли людям выживать ради спасения животных? Ссылка", "a": "Японский философ Масахиро Мориока в статье 2026 года (Cambridge Quarterly of Healthcare Ethics) сформулировал изящный парадокс: если люди обязаны остановить страдания диких животных, но не могут сделать это в одном поколении, то последовательный сентиоцентрический антинаталист якобы обязан продолжать размножаться ради будущей помощи животным.\n\nВ монографии и аналитических разборах Efilism RUS этот парадокс снимается разграничением строгой деонтологической обязанности и стратегического предела: этика защитного порога запрещает приносить новых несогласных детей в жертву ради неопределённого «проекта спасения дикой природы». Сокращение вреда в дикой природе — задача, которую следует решать в пределах доступных технологий и знаний без создания новых невольных «солдат».", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-30"}]}, {"title": "Раздел 5. Ненасилие, право на выход, промортализм и «красная кнопка»", "items": [{"id": "faq_31", "num": "31", "anchor": "q-31", "q": "Вопрос 31. Одобряет ли эфилизм насилие, террор или принудительное уничтожение людей? Ссылка", "a": "Категорически нет. Систематический эфилизм (монография, гл. 33, 44, 49) проводит строгую границу между превентивным отказом от создания новых субъектов и безусловным уважением к автономии и неприкосновенности уже живущих существ.\n\nЛюбые формы индивидуального насилия, террора, саботажа или принудительного причинения вреда не только этически недопустимы, но и практически контрпродуктивны: они умножают реальные страдания, не останавливают воспроизводство и дискредитируют просветительскую работу. Даже на ныне заблокированном сабреддите r/Efilism второе правило прямо запрещало любые призывы к насилию под угрозой бана.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-31"}, {"id": "faq_32", "num": "32", "anchor": "q-32", "q": "Вопрос 32. Чем эфилизм отличается от промортализма? Почему эфилисты сами продолжают жить? Ссылка", "a": "Промортализм утверждает, что для любого живущего существа всегда лучше немедленно умереть. Эфилизм — это позиция о недопустимости создания новых жизней (антинатализм), а не предписание немедленной смерти.\n\nУже существующие люди имеют привязанности, незавершённые дела, страх перед болезненным умиранием и ответственность перед близкими и животными. Кроме того, как подчёркивает Гэри (WTF #970), на практике нам вообще не нужно, чтобы живущие люди умирали — для решения проблемы достаточно остановить появление новых поколений, а живущий сторонник эфилизма приносит пользу именно тем, что снижает страдания и просвещает других.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-32"}, {"id": "faq_33", "num": "33", "anchor": "q-33", "q": "Вопрос 33. Как систематический эфилизм относится к мысленному эксперименту с «красной кнопкой» (кнопкой Дж. Дж. С. Смарта)? Ссылка", "a": "«Красная кнопка» (изначально сформулированная Дж. Дж. С. Смартом в 1958 году как критика негативного утилитаризма — «доброжелательный разрушитель мира») — это чисто гипотетический мысленный эксперимент: мгновенное, абсолютно безболезненное и полное прекращение всей чувствующей жизни без каких-либо побочных последствий.\n\nВ устной полемике Гэри использует эту кнопку как диагностический тест на честность консеквенциалистской оценки («готов ли ты предотвратить триллионы часов будущих пыток ценой мгновенного безболезненного финала?»). При этом и Гэри, и монография чётко отделяют эту теоретическую модель от реальной практики: в реальном мире никакой «стерильной кнопки» не существует, а любые попытки насильственного вмешательства обернулись бы катастрофическим ростом страданий.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-33"}, {"id": "faq_34", "num": "34", "anchor": "q-34", "q": "Вопрос 34. Почему Гэри (Inmendham) жёстко критикует Дэвида Бенатара за отказ от практических мер и «красной кнопки»? Ссылка", "a": "В цикле из семи переведённых разборов (включая WTF #889, #892, #945, #970) Гэри хвалит раннего Бенатара за логику асимметрии и тезис о применимости аргументов к животным, но обвиняет позднего Бенатара в отступлении от собственных выводов.\n\nГлавные претензии Гэри: Бенатар называет деторождение «серьёзным вредом», но отвергает любые правовые и социальные стимулы (даже отмену пронаталистических субсидий при демократическом большинстве), прикрываясь аргументом человеческой погрешимости (фаллибилизма), и фактически бросает диких животных на произвол судьбы. С точки зрения Гэри, «отказ решать — это тоже решение» в пользу статус-кво.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-34"}, {"id": "faq_35", "num": "35", "anchor": "q-35", "q": "Вопрос 35. Что означает «право на достойный выход» (медицинская автономия и заблаговременное волеизъявление) в эфилизме? Ссылка", "a": "Поскольку никто не давал согласия на вход в жизнь, зрелый человек должен иметь право на мирный, безболезненный и юридически защищённый выход из неё — особенно при неизлечимых болезнях и невыносимых страданиях (монография, гл. 42–43).\n\nЭфилизм решительно против импульсивных действий и поддерживает строгие правовые предохранители: медицинскую проверку отсутствия внешнего давления и острого временного кризиса, период спокойного обдумывания, институт заблаговременного волеизъявления (прижизненной директивы) и полное право противников этой меры заранее зафиксировать отказ от неё для себя. Как показывает статистика штата Орегон, само наличие законного «запасного выхода» снижает тревогу, и значительная часть получивших доступ пациентов им так и не пользуется.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-35"}, {"id": "faq_36", "num": "36", "anchor": "q-36", "q": "Вопрос 36. Почему эфилизм категорически осудил теракт у клиники ЭКО в Палм-Спрингс (2025) и какое отношение к нему имеет Адам Лэнза (2012)? Ссылка", "a": "17 мая 2025 года 25-летний Гай Эдвард Барткус совершил суицидальный взрыв у клиники ЭКО в Палм-Спрингс. Следствие установило, что непосредственным толчком стал его личный суицидальный пакт после гибели подруги Софи Тинни, а сам он называл себя проморталистом и собрал в манифесте хаотичную смесь разнородных ссылок. Уже на следующий день, 18 мая 2025 года, Гэри выпустил заявление «RE The Bad IVF Thing», безоговорочно осудив теракт как безумие и вред делу.\n\nПривязка к эфилизму Адама Лэнзы (трагедия в школе «Сэнди-Хук» 14 декабря 2012 года) — грубый хронологический и фактический подлог: сабреддит r/Efilism появился лишь в начале 2013 года, а сам Лэнза был ценностным нигилистом, который в своих записях прямо отвергал и высмеивал философию Гэри как «слишком морализаторскую».", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-36"}, {"id": "faq_37", "num": "37", "anchor": "q-37", "q": "Вопрос 37. Чем эфилизм отличается от движения ProExtinction (Extinctionism) и почему между ними возник конфликт? Ссылка", "a": "Проект ProExtinction (proextinction.com) позиционирует себя как отдельное движение «экстинкционизма», дистанцируясь от антинатализма и делая ставку на уличный активизм и провокационную риторику «ускорения вымирания любой ценой».\n\nМежду Гэри (Inmendham), систематическим эфилизмом и лидерами ProExtinction произошёл жёсткий разрыв (включая дебаты декабря 2025 года): эфилизм критикует ProExtinction за доктринальную небрежность, отказ от опоры на аргументацию и сомнительные активистские стратегии, подставляющие всю философию под репутационные и правовые удары.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-37"}]}, {"title": "Раздел 6. Детерминизм, свобода воли, моральный реализм и религия", "items": [{"id": "faq_38", "num": "38", "anchor": "q-38", "q": "Вопрос 38. Если в мире действует детерминизм и нет абсолютной свободы воли, какой смысл в этике и убеждении? Ссылка", "a": "Детерминизм не равен фатализму (монография, гл. 13). Отсутствие мистической «свободы от причин» не означает, что наши мысли и решения ни на что не влияют — наоборот, именно идеи, факты и убедительные аргументы выступают реальными причинными факторами, перестраивающими работу человеческого мозга.\n\nГэри называет это «информированной волей»: отказ от метафизической вины и мести не отменяет прагматической оценки вреда, просвещения и разумного социального сдерживания.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-38"}, {"id": "faq_39", "num": "39", "anchor": "q-39", "q": "Вопрос 39. Как эфилизм отвечает моральным нигилистам и на «гильотину Юма» (разрыв между сущим и должным)? Ссылка", "a": "Моральный нигилист утверждает: «Боль — это просто физический факт, из него не следует, что её не должно быть». Эфилизм отвечает через натуралистический моральный реализм (монография, гл. 21–23, 30; «Дебаты о моральном реализме» Гэри): субъективное переживание мучительной боли по самой своей внутренней природе обладает отрицательной валентностью — это не вкусовое предпочтение вроде «пиццы с ананасами», а объективное событие вреда.\n\nВ пустой Вселенной из камней нет проблем, но появление одного чувствующего существа онтологически создаёт измерение вреда. Рациональный агент, понимающий реальность чужой боли как равную собственной, получает прямое основание её не умножать.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-39"}, {"id": "faq_40", "num": "40", "anchor": "q-40", "q": "Вопрос 40. Как вообще возможно считать что-либо рациональным в безличной физической Вселенной? Ссылка", "a": "Точнее спросить: как рациональность возникает внутри безличного физического мира? Она возникает точно так же, как возникают сами биологические функции из неживых элементарных частиц — в результате усложнения материальных систем, формирования нейронных контуров обратной связи и появления способности моделировать причины, следствия и способы устранения ошибок.\n\nБезличность Вселенной не отменяет объективности логических и причинно-следственных связей. Огонь обжигает, а предотвращение боли уменьшает реальное страдание независимо от того, существует ли во Вселенной какой-то «космический замысел».", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-40"}, {"id": "faq_41", "num": "41", "anchor": "q-41", "q": "Вопрос 41. Не возникает ли противоречия: при прекращении жизни исчезнет и сама рациональность? Ссылка", "a": "Противоречия здесь нет. Рациональность имеет инструментальную ценность именно постольку, поскольку существуют проблемы, ошибки, уязвимость и страдания, требующие решения и предотвращения.\n\nЕсли устранена сама область проблем и уязвимости, отсутствие инструмента их решения перестаёт быть каким-либо недостатком — подобно тому как полное исчезновение болезней делает ненужной медицину. Никто не считает, что нужно искусственно поддерживать эпидемии только ради сохранения профессии врача.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-41"}, {"id": "faq_42", "num": "42", "anchor": "q-42", "q": "Вопрос 42. Неужели без чувствующих существ нет никакой ценности? А как же красивая гора на необитаемой планете? Ссылка", "a": "Красота не является самостоятельным физическим свойством камня, подобным массе, плотности или температуре; она возникает как результат восприятия и эстетической оценки в сознании наблюдателя. На безжизненной планете существуют геологические структуры, но никто не испытывает ни восторга от их созерцания, ни утраты от их отсутствия.\n\nТочно так же и сама Вселенная не «скучает» без зрителей. Приписывать пустой планете «трагедию невостребованной красоты» — это типичный антропоморфизм, перенос собственных психологических реакций на неживую материю.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-42"}, {"id": "faq_43", "num": "43", "anchor": "q-43", "q": "Вопрос 43. Совместим ли эфилизм с религией или верой в Бога? Ссылка", "a": "Исторически эфилизм опирается на научный натурализм и атеизм: эволюционная биология исчерпывающе объясняет происхождение боли и страдания без гипотезы «благого творца». Если допустить существование всемогущего Бога, чьи цели «неисповедимы», пронаталист всегда сможет укрыться за теодицеей («значит, страдания нужны для высшего блага»).\n\nПри этом в истории мысли существовали пессимистические религиозные течения (например, античный гностицизм), считавшие материальный мир ошибочным творением. Тем не менее для верующего в традиционные авраамические религии пронатализм сам по себе логически уязвим: рождение нового человека впервые подвергает его риску вечных мук.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-43"}, {"id": "faq_44", "num": "44", "anchor": "q-44", "q": "Вопрос 44. Как эфилизм относится к буддизму, восточным учениям и классическому философскому пессимизму (Шопенгауэр, Хорстманн)? Ссылка", "a": "Эфилизм признаёт верным диагноз Первой благородной истины буддизма (жизнь неразрывно связана со страданием), но критикует классический буддизм за уход в индивидуальное «освобождение» при оставлении остальной биосферы в цикле страданий, а также за попытки объявить физическую боль «иллюзией».\n\nС классическим немецким пессимизмом (Артур Шопенгауэр, Петер Вессель Цапффе, Ульрих Хорстманн с его «Чудовищем» 1983 года) эфилизм роднит трезвая оценка бытия, но разделяет отношение к действию: в полемике на r/Pessimism классические пессимисты упрекают эфилизм в «избыточном просветительском оптимизме», тогда как эфилизм критикует фатализм за капитуляцию перед предотвратимым вредом. От «антропофуги» Хорстманна эфилизм принципиально отличается сентиоцентризмом и полным отказом от апокалиптической эстетизации.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-44"}, {"id": "faq_45", "num": "45", "anchor": "q-45", "q": "Вопрос 45. Чем традиционный этический эфилизм отличается от «кремниеводолинного про-экстинкционизма» (классификация Эмиля Торреса, 2025)? Ссылка", "a": "В академической статье 2025 года в The Journal of Value Inquiry философ Эмиль П. Торрес разделил «традиционный» про-экстинкционизм (антинатализм, эфилизм — мотивированный состраданием и отказом от причинения вреда) и «кремниеводолинный» про-экстинкционизм (постгуманистов и техноутопистов, готовых пожертвовать биологическим человечеством ради создания «богоподобного» сверхинтеллекта и колонизации космоса).\n\nЭфилизм является прямым антагонистом кремниеводолинного постгуманизма: вместо замены людей искусственными носителями новых, потенциально астрономических страданий (s-рисков) эфилизм требует не множить чувствующие системы вообще.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-45"}]}, {"title": "Раздел 7. Общество, демография, ИИ и будущее", "items": [{"id": "faq_46", "num": "46", "anchor": "q-46", "q": "Вопрос 46. Если люди перестанут рожать детей, разве последнее поколение не умрёт в хаосе и беспомощности? Ссылка", "a": "Это одно из самых частых опасений, но оно основано на нереалистичном допущении мгновенного обрушения рождаемости до нуля «завтра утром». В действительности демографическое сокращение происходит плавно на протяжении многих поколений (монография, гл. 44).\n\nПо мере снижения численности общества автоматизация, робототехника, медицина и перераспределение ресурсов (высвобождающихся от содержания растущей демографической пирамиды) позволяют обеспечить достойный уход пожилым людям. Кроме того, даже гипотетические трудности финального поколения несопоставимо меньше суммы страданий, которые неизбежно выпадут на долю десятков и сотен будущих поколений при бесконечном продолжении рода.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-46"}, {"id": "faq_47", "num": "47", "anchor": "q-47", "q": "Вопрос 47. Какова реалистичная стратегия эфилизма в отношении человечества («пряник, а не кнут» и демографический переход)? Ссылка", "a": "Статистика по всему миру (от Европы и Восточной Азии до Ирана и Латинской Америки) показывает, что главным драйвером снижения рождаемости является не принуждение, а образование (особенно женщин), урбанизация, доступная контрацепция и рост личной автономии. Как только у людей появляется знание и свобода выбора, рождаемость устойчиво падает ниже уровня воспроизводства.\n\nПоэтому реалистичная стратегия эфилизма строится по принципу «пряника, а не кнута»: просвещение, свободный доступ к контрацепции и медицинской автономии, отмена агрессивной пронаталистической пропаганды и пересмотр экономических стимулов, подталкивающих людей к неосознанному деторождению.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-47"}, {"id": "faq_48", "num": "48", "anchor": "q-48", "q": "Вопрос 48. Не спасёт ли нас прогресс, генетика, трансгуманизм или искусственный интеллект (создание «рая на Земле»)? Ссылка", "a": "Наука и медицина действительно способны существенно снизить повседневную боль уже живущих людей — и эфилизм приветствует паллиативную помощь и прогресс медицины. Однако идея «гарантированного технологического рая» (гедонистического императива или цифрового бессмертия) сталкивается с тремя неустранимыми барьерами (монография, гл. 45–46):\n\n(1) риск катастрофических ошибок и появления новых, ещё более тяжёлых форм страдания (s-рисков); (2) невозможность компенсировать уже совершённые и текущие страдания миллиардов живых существ будущей утопией; (3) отсутствие какой-либо предсуществующей нужды в самом существовании «счастливых постлюдей».", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-48"}, {"id": "faq_49", "num": "49", "anchor": "q-49", "q": "Вопрос 49. Что такое BAAN Томаса Метцингера, s-риски и почему эфилизм против колонизации космоса и создания искусственной сентиентности? Ссылка", "a": "Немецкий философ сознания Томас Метцингер предложил принцип BAAN (Benevolent Artificial Anti-Natalism — «благожелательный искусственный антинатализм»): строгий мораторий на создание искусственных систем, способных испытывать субъективные страдания, поскольку неконтролируемое тиражирование цифрового сознания способно породить астрономические объёмы боли (s-риски — риски страданий колоссального масштаба).\n\nПо той же причине эфилизм выступает против панспермии и заселения других планет земной жизнью: экспорт ДНК в космос означает многократное тиражирование эволюционной бойни на миллиарды лет за пределами Земли.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-49"}, {"id": "faq_50", "num": "50", "anchor": "q-50", "q": "Вопрос 50. Не противоречит ли отказ от размножения «законам природы» и эволюционной программе? Ссылка", "a": "Нет никакого «закона природы», обязывающего разумное существо размножаться. Эволюция — это слепой статистический процесс, а не законодатель и не моральный авторитет. Человеческая цивилизация на каждом шагу идёт против эволюционной программы: мы носим очки, лечим инфекции антибиотиками, пользуемся контрацепцией, запрещаем право сильного и защищаем слабых.\n\nУтверждать, что деторождение «правильно, потому что естественно», — значит совершать натуралистическую ошибку. Наличие разума именно тем и ценно, что позволяет критически оценивать биологические импульсы, а не подчиняться им вслепую.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-50"}]}, {"title": "Раздел 8. Психология, стереотипы и ответы на популярную критику", "items": [{"id": "faq_51", "num": "51", "anchor": "q-51", "q": "Вопрос 51. Правда ли, что антинаталисты и эфилисты — это люди с чертами «Тёмной тетрады» (миф из интервью Джордана Питерсона и Илона Маска)? Ссылка", "a": "Нет, это грубое искажение данных. В интервью 2024 года Джордан Питерсон сослался на исследования Фила Шёнеггера (2021/2022) и заявил, будто антинатализм связан с «Тёмной тетрадой» (макиавеллизмом, психопатией, нарциссизмом и садизмом).\n\nПроверка первоисточников (Шёнеггер, 2021/2022; Михан, Зиглер-Хилл и Шэкелфорд, 2024) выявляет три факта, о которых Питерсон умолчал: (1) корреляции были слабыми и касались преимущественно депрессивности и мрачного взгляда на мир, а вовсе не «садизма» или желания причинять зло; (2) сам Шёнеггер прямо предостерёг от использования его статьи как аргумента ad hominem против философии антинатализма; (3) в исследовании 2024 года связь полностью опосредовалась реалистично-мрачным восприятием мира («первичными убеждениями о мире»), а не отсутствием эмпатии.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-51"}, {"id": "faq_52", "num": "52", "anchor": "q-52", "q": "Вопрос 52. Правда ли, что эфилизм — это просто депрессия или личная обида на жизнь? Ссылка", "a": "Сводить философскую аргументацию к психологическому состоянию её носителей — логическая ошибка перехода на личности (генетическая ошибка / ad hominem). Истинность утверждений о смертности, болезнях, r-отборе и конститутивном риске не зависит от того, в каком настроении находится говорящий.\n\nБолее того, психологический феномен «депрессивного реализма» и естественное сострадательное огорчение при столкновении с масштабами боли в мире не делают оценку реальности ложной. Среди сторонников антинатализма и эфилизма немало вполне благополучных, социально адаптированных людей, пришедших к этим выводам из эмпатии и логики.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-52"}, {"id": "faq_53", "num": "53", "anchor": "q-53", "q": "Вопрос 53. Как эфилизм относится к уже рождённым детям, родителям, близости и человеческому теплу? Ссылка", "a": "С глубоким сочувствием и уважением к их благополучию (монография, гл. 37 и 41). Критика прокреации направлена против самого акта создания нового риска, а не против уже живущих людей и не против любви к детям. Если ребёнок уже родился, высший долг взрослых — окружить его заботой, безопасностью и теплом.\n\nРавным образом систематический эфилизм выступает против травли родителей: большинство людей заводит детей под давлением культуры, биологических импульсов и недостатка информации. Эффективный диалог строится на уважении, ясности и сострадании, а не на агрессии.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-53"}, {"id": "faq_54", "num": "54", "anchor": "q-54", "q": "Вопрос 54. Эта философия кажется слишком мрачной: что может сделать один человек и придётся ли жертвовать личными мечтами (например, условной «премией Эмми»)? Ссылка", "a": "Трезвый взгляд на устройство биосферы не означает бессилия или отказа от осмысленной, деятельной жизни. Каждый человек может внести реальный вклад в уменьшение страданий: через личный репродуктивный выбор, этичное потребление, просвещение о проблеме страданий диких животных и видовой дискриминации, поддержку благотворительных, научных и правозащитных инициатив.\n\nЧто касается личных амбиций, честный взгляд в перспективу столетия быстро показывает, сколь эфемерны статусные награды вроде условной «премии Эмми». Отказ от действий, причиняющих вред, и постепенное смещение фокуса к альтруизму могут потребовать внутренней перестройки, однако исследования в области психологии подтверждают, что осмысленное сострадание и помощь другим нередко приносят человеку более глубокое внутреннее равновесие и чувство солидарности с окружающим миром.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-54"}, {"id": "faq_55", "num": "55", "anchor": "q-55", "q": "Вопрос 55. С чего начать глубокое изучение эфилизма и какие материалы стоит прочитать в первую очередь? Ссылка", "a": "Для системного знакомства оптимально двигаться по трём ступеням:\n\n1) Базовое введение: настоящий ЧаВО и «Философская система Гэри: нейтральный аналитический очерк» (сводный обзор более 90 материалов архива Efilism RUS). 2) Фундаментальная база: монография «Эфилизм: Философия абсолютного антинатализма» (2-е изд., 2026) — особенно «Доказательная карта книги», главы 31–33 (Минимальное этическое ядро и защитный порог) и Приложение B (44 типовых возражения). 3) Первоисточники и полемика: ключевые переводы Гэри (Inmendham) из каталога Efilism RUS (WTF #980, WTF #959, «Эфилизм DoNotGo.com», дебаты с Магнусом Виндингом и разборы Дэвида Бенатара), а также академические работы Дэвида Бенатара, Магнуса Виндинга, Оскара Орты, Томаса Метцингера и Эмиля Торреса.", "url": "https://bohdan19p-bit.github.io/efilism-faq/#q-55"}]}], "gary": [{"title": "1. Физика и слепая Вселенная", "items": [{"id": "g_1", "title": "Физика → химия → биология: Вселенная без мозга", "thesis": "И в физике, и в оценке жизни Гэри отвергает удобные мифы; Вселенная действует вслепую и не обещает «запасного выхода».", "quote": "«В обоих случаях я просто указываю на очевидную вещь: рассказ, который нам продают, не имеет никакого смысла... Вселенная не делает ничего умного, потому что у неё нет мозга. Она действует вслепую — как миллион обезьян за пишущими машинками, которые напечатают только ужасную пародию на Шекспира»."}]}, {"title": "2. Эфилизм и Дэвид Бенатар", "items": [{"id": "g_2", "title": "Зачем нужен эфилизм, если Бенатар — сентиоцентрист?", "thesis": "Бенатар ограничивается одной фразой о животных и не строит аргументацию от лица собаки, мыши или газели; проблема в самой жизни как явлении.", "quote": "«Да, люди лживы и эгоистичны. Но представь, что разум обрели бы слоны, белые акулы, муравьи или пчёлы — они были бы ничуть не лучше, а то и хуже... Я, может, и не звучу как вежливый и милый человек, но я цивилизован в главном: я отличаю пустую забаву от ужасной пытки»."}, {"id": "g_3", "title": "Академический расчёт против прожитого опыта и эмпатия к мышам", "thesis": "Бенатар — блестящий полемист, но с пораженческой риторикой; Гэри прожил позицию на личном опыте и подчёркивает реальность страданий животных.", "quote": "«Я свою позицию прожил. Для меня это не холодный академический расчёт на компьютере в духе \"58% против 47%\"... Нельзя делать вид, будто страдание существа не считается только потому, что оно не умеет считать до семи. Оно прекрасно знает, что такое боль, страх и мучение»."}]}, {"title": "3. Психология и акроним C.R.A.P.", "items": [{"id": "g_4", "title": "«Горилла внутри» и иллюзия абсолютного бескорыстия", "thesis": "Биологическое существование держится на отъёме энергии; даже в любви и альтруизме есть скрытая эмоциональная выгода.", "quote": "«Суть в том, что наш разум вынужден договариваться с сидящей внутри гориллой — кормить её бананами, льстить ей, чтобы заставить сделать хоть что-то правильное. Даже бросаясь на гранату, человек получает \"прибыль\" в виде ощущения героизма и верности принципам»."}, {"id": "g_5", "title": "Зависимость и «жёсткий диск» первых 18 лет", "thesis": "Воспитание и среда диктуют до 80% предпочтений; ясность начинается с признания собственной предвзятости.", "quote": "«Единственный шанс сохранить ясность — признать, что каждая часть тебя предвзята. Главная наша трагедия в том, что нашему разуму приходится ехать верхом на упрямой обезьяне, которую невозможно поменять на новую»."}]}, {"title": "4. Практика, образование и демократия", "items": [{"id": "g_6", "title": "Образование вместо хитрых схем", "thesis": "В развитых странах рождаемость уже ниже уровня воспроизводства; главная проблема — бедность, невежество и религиозный фанатизм.", "quote": "«Во всех развитых странах рождаемость уже ниже уровня воспроизводства, население стареет и идёт к естественному угасанию. Войну в этом смысле мы почти выиграли. Главная проблема — бедность, невежество и религиозный фанатизм, где рождаемость продолжают субсидировать»."}, {"id": "g_7", "title": "Прямая демократ
