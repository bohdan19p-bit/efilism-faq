<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Efilism RUS · Пульт быстрого реагирования</title>
<style>
  :root {
    --bg: #0c0f14;
    --surface: #151a22;
    --surface-2: #1d2430;
    --border: #283141;
    --text: #eef2f7;
    --muted: #93a1b5;
    --accent: #e04848;
    --accent-soft: rgba(224, 72, 72, 0.14);
    --green: #22c55e;
    --green-soft: rgba(34, 197, 94, 0.16);
    --amber: #f59e0b;
    --blue: #60a5fa;
    --radius: 12px;
    --shadow: 0 4px 16px rgba(0,0,0,0.35);
  }
  [data-theme="light"] {
    --bg: #f4f6f9;
    --surface: #ffffff;
    --surface-2: #eef2f6;
    --border: #d8e0ea;
    --text: #161d26;
    --muted: #5a6778;
    --accent: #b91c1c;
    --accent-soft: rgba(185, 28, 28, 0.10);
    --green: #16a34a;
    --green-soft: rgba(22, 163, 74, 0.13);
    --amber: #d97706;
    --blue: #2563eb;
    --shadow: 0 2px 10px rgba(15,23,42,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    font-size: 15px; line-height: 1.48;
    overflow-x: hidden;
  }
  /* Sticky Top Shell */
  .topbar {
    position: sticky; top: 0; z-index: 40;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 12px 8px;
    backdrop-filter: blur(10px);
  }
  .top-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; max-width: 760px; margin: 0 auto 8px;
  }
  .brand {
    display: flex; align-items: center; gap: 8px; min-width: 0;
  }
  .brand-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); flex-shrink: 0;
    box-shadow: 0 0 10px var(--accent);
  }
  .brand-title {
    font-weight: 700; font-size: 15px; letter-spacing: -0.01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .brand-sub {
    font-size: 11px; color: var(--muted); font-weight: 500;
  }
  .top-actions {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .icon-btn {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px;
    height: 34px; padding: 0 10px; font-size: 13px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    cursor: pointer; transition: 0.15s;
  }
  .icon-btn:active { transform: scale(0.96); }
  .icon-btn.active {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent);
  }
  /* Search */
  .search-wrap {
    position: relative; max-width: 760px; margin: 0 auto 8px;
  }
  .search-input {
    width: 100%; height: 40px;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 0 38px 0 36px; font-size: 14px; outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--muted); }
  .search-icon {
    position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
    color: var(--muted); font-size: 14px; pointer-events: none;
  }
  .search-clear {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: var(--surface-2); color: var(--muted);
    border: none; border-radius: 7px; width: 28px; height: 28px;
    font-size: 15px; cursor: pointer; display: none;
    align-items: center; justify-content: center;
  }
  .search-clear.visible { display: inline-flex; }
  /* Tabs */
  .tabs-wrap {
    max-width: 760px; margin: 0 auto;
    display: flex; gap: 6px; overflow-x: auto;
    scrollbar-width: none; padding-bottom: 2px;
  }
  .tabs-wrap::-webkit-scrollbar { display: none; }
  .tab-btn {
    flex: 0 0 auto;
    background: var(--surface); color: var(--muted);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 7px 11px; font-size: 13px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    transition: 0.15s; white-space: nowrap;
  }
  .tab-btn .cnt {
    font-size: 11px; opacity: 0.78; font-weight: 600;
    background: var(--surface-2); padding: 1px 5px; border-radius: 6px;
  }
  .tab-btn.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .tab-btn.active .cnt {
    background: rgba(255,255,255,0.22); color: #fff; opacity: 1;
  }
  /* Main Container */
  .main {
    max-width: 760px; margin: 0 auto;
    padding: 12px 12px 84px;
  }
  .toolbar-meta {
    display: flex; align-items: center; justify-content: space-between;
    gap: 8px; margin-bottom: 10px; font-size: 12px; color: var(--muted);
  }
  .mini-link-btn {
    background: transparent; border: none; color: var(--blue);
    font-size: 12px; font-weight: 600; cursor: pointer; padding: 4px 6px;
  }
  /* Collapsible Group */
  .group {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .group-head {
    width: 100%; background: transparent; color: var(--text);
    border: none; padding: 12px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 14px; font-weight: 700; text-align: left; cursor: pointer;
  }
  .group-head-left {
    display: flex; align-items: center; gap: 8px; min-width: 0;
  }
  .group-badge {
    font-size: 11px; font-weight: 700; color: var(--muted);
    background: var(--surface-2); padding: 2px 7px; border-radius: 999px;
    flex-shrink: 0;
  }
  .chev {
    color: var(--muted); font-size: 12px; transition: transform 0.18s;
    flex-shrink: 0;
  }
  .group.open .chev { transform: rotate(180deg); }
  .group-body {
    display: none; border-top: 1px solid var(--border);
  }
  .group.open .group-body { display: block; }
  /* Item Card inside Group */
  .item {
    padding: 11px 13px;
    border-bottom: 1px solid var(--border);
  }
  .item:last-child { border-bottom: none; }
  .item-top {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  }
  .item-title {
    font-weight: 600; font-size: 14px; color: var(--text);
    line-height: 1.35; flex: 1; min-width: 0;
  }
  .cmd-pill {
    display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13px; font-weight: 700; color: var(--accent);
    background: var(--accent-soft); padding: 2px 8px; border-radius: 6px;
    margin-right: 6px;
  }
  .star-btn {
    background: transparent; border: none; color: var(--muted);
    font-size: 17px; line-height: 1; padding: 2px 4px; cursor: pointer;
    flex-shrink: 0;
  }
  .star-btn.starred { color: var(--amber); }
  .item-desc {
    margin-top: 5px; font-size: 13px; color: var(--muted);
    white-space: pre-line;
  }
  .item-expand {
    margin-top: 7px; padding: 9px 10px;
    background: var(--surface-2); border-radius: 8px;
    font-size: 13px; color: var(--text); white-space: pre-line;
    display: none; border-left: 3px solid var(--accent);
  }
  .item-expand.open { display: block; }
  .item-actions {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px;
  }
  .btn {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 11px; font-size: 12.5px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
    text-decoration: none; transition: 0.14s;
    background: var(--surface-2); color: var(--text);
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .btn-copied {
    background: var(--green) !important; color: #fff !important;
    border-color: var(--green) !important;
  }
  .btn-ghost {
    background: transparent; color: var(--muted);
  }
  .btn-danger {
    color: var(--accent); background: var(--accent-soft); border-color: transparent;
  }
  /* Empty State */
  .empty {
    text-align: center; padding: 36px 16px; color: var(--muted);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius);
  }
  .empty strong { display: block; color: var(--text); margin-bottom: 6px; font-size: 15px; }
  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px);
    background: #111827; color: #fff; border: 1px solid rgba(255,255,255,0.14);
    padding: 10px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
    box-shadow: 0 10px 28px rgba(0,0,0,0.45);
    opacity: 0; pointer-events: none; transition: 0.2s ease; z-index: 90;
    max-width: 90vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  /* Modal for Custom Snippets */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.65);
    display: none; align-items: flex-end; justify-content: center; z-index: 80;
    padding: 12px;
  }
  .modal-backdrop.open { display: flex; }
  @media (min-width: 640px) {
    .modal-backdrop { align-items: center; }
  }
  .modal {
    width: 100%; max-width: 520px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 16px; box-shadow: 0 18px 48px rgba(0,0,0,0.5);
  }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .modal-title { font-weight: 700; font-size: 15px; }
  .field { margin-bottom: 10px; }
  .field label {
    display: block; font-size: 12px; font-weight: 600; color: var(--muted);
    margin-bottom: 4px;
  }
  .field input, .field textarea {
    width: 100%; background: var(--bg); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 9px 10px; font-size: 14px; font-family: inherit; outline: none;
  }
  .field textarea { min-height: 110px; resize: vertical; }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .modal-foot {
    display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="top-row">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <div>
        <div class="brand-title">Efilism RUS · Пульт</div>
        <div class="brand-sub" id="totalStats">Загрузка…</div>
      </div>
    </div>
    <div class="top-actions">
      <button type="button" class="icon-btn" id="favFilterBtn" title="Только избранное">★ <span id="favCount">0</span></button>
      <button type="button" class="icon-btn" id="addCustomBtn" title="Добавить свой шаблон">+ Свой</button>
      <button type="button" class="icon-btn" id="themeBtn" title="Сменить тему">☀️</button>
    </div>
  </div>

  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="search" id="searchInput" class="search-input" placeholder="Поиск: бенатар, #book, насилие, веган, климат…" autocomplete="off">
    <button type="button" id="clearSearchBtn" class="search-clear" aria-label="Очистить поиск">×</button>
  </div>

  <nav class="tabs-wrap" id="tabsNav" aria-label="Разделы шпаргалки">
    <button type="button" class="tab-btn active" data-tab="quick">⚡ Ответы <span class="cnt" id="cnt-quick">0</span></button>
    <button type="button" class="tab-btn" data-tab="materials">🔗 Ссылки <span class="cnt" id="cnt-materials">0</span></button>
    <button type="button" class="tab-btn" data-tab="rose">🤖 Rose <span class="cnt" id="cnt-rose">0</span></button>
    <button type="button" class="tab-btn" data-tab="faq">❓ ЧаВо <span class="cnt" id="cnt-faq">0</span></button>
    <button type="button" class="tab-btn" data-tab="gary">🎙 Гэри <span class="cnt" id="cnt-gary">0</span></button>
    <button type="button" class="tab-btn" data-tab="constructive">🛠 Конструктив <span class="cnt" id="cnt-constructive">0</span></button>
    <button type="button" class="tab-btn" data-tab="custom">📌 Мои <span class="cnt" id="cnt-custom">0</span></button>
  </nav>
</header>

<main class="main">
  <div class="toolbar-meta">
    <span id="statusLine">Быстрые ответы для чата</span>
    <button type="button" class="mini-link-btn" id="toggleAllBtn">Развернуть все</button>
  </div>
  <div id="contentRoot"></div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite">Скопировано</div>

<div class="modal-backdrop" id="customModal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">Новый быстрый шаблон</div>
      <button type="button" class="icon-btn" id="closeModalBtn">×</button>
    </div>
    <div class="field">
      <label for="customTitle">Заголовок (для поиска)</label>
      <input type="text" id="customTitle" placeholder="Например: Ответ про рекламу / ссылку на пост">
    </div>
    <div class="field">
      <label for="customText">Текст для копирования в чат</label>
      <textarea id="customText" placeholder="Вставь готовый текст ответа или ссылки…"></textarea>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" id="cancelModalBtn">Отмена</button>
      <button type="button" class="btn btn-primary" id="saveCustomBtn">Сохранить</button>
    </div>
  </div>
</div>

<script>
const DATA = {"quick": [{"title": "🎯 «В эфилизме…» — база и суть за 10 секунд", "items": [{"id": "qr_what", "title": "Что такое эфилизм в двух словах?", "tags": "определение суть основа новичок", "text": "Эфилизм — это сентиоцентрическая философия абсолютного антинатализма. Её ядро простое: сознательное страдание реально и объективно плохо, а создание новых чувствующих существ без их согласия навязывает им некомпенсируемый риск тяжёлого вреда. Речь идёт о ненасильственном предотвращении новых страданий, а не о вреде уже живущим.\n\nКоротко за 5 минут: https://bohdan19p-bit.github.io/efilism-faq/concept.html"}, {"id": "qr_diff_an", "title": "Чем эфилизм отличается от обычного антинатализма?", "tags": "отличие антинатализм сентиоцентризм животные", "text": "Классический антинатализм часто фокусируется только на людях. Эфилизм последовательно сентиоцентричен: морально значим любой чувствующий субъект, способный испытывать боль и страдание, включая диких и домашних животных. Проблема не в «плохих людях», а в самой механике слепой биологической эволюции.\n\nПодробнее в ЧаВО: https://bohdan19p-bit.github.io/efilism-faq/#q-2"}, {"id": "qr_threshold", "title": "«Но в жизни же есть радость и счастье!»", "tags": "счастье радость баланс порог асимметрия", "text": "Эфилизм не отрицает радость, любовь или хорошее качество жизни у конкретных людей. Но чужое удовольствие не компенсирует чужую агонию, а отсутствие радости у нерождённого никому не причиняет вреда — в отличие от боли, которую испытает рождённый. Защитный порог: нельзя оправдывать гарантированную цену тяжёлых страданий ради необязательных благ.\n\nРазбор в Вики: https://bohdan19p-bit.github.io/efilism-faq/wiki.html"}, {"id": "qr_newbie", "title": "С чего начать знакомство с темой?", "tags": "старт навигация новичку ссылки", "text": "Лучше всего начать с короткого обзора на 5 минут, а затем заглянуть в Большой ЧаВО (55 вопросов) или 3D-страницу монографии:\n\n• Единый навигатор: https://bohdan19p-bit.github.io/efilism-faq/start.html\n• Концепт за 5 минут: https://bohdan19p-bit.github.io/efilism-faq/concept.html\n• Большой ЧаВО (55 вопросов): https://bohdan19p-bit.github.io/efilism-faq/"}]}, {"title": "🛡 «Эфилизм = насилие?» — ответы на частые атаки", "items": [{"id": "qr_violence", "title": "«Эфилисты призывают к насилию / терактам / смерти»", "tags": "насилие промортализм закон запрет", "text": "Это грубая подмена. Эфилизм строго различает два вопроса: этику создания новых субъектов и отношение к уже существующим. У уже живущих людей и животных есть прямой интерес не подвергаться насилию и принуждению. Efilism RUS принципиально отвергает насилие, самосуд и любые незаконные действия.\n\nРазбор в ЧаВО: https://bohdan19p-bit.github.io/efilism-faq/#q-31"}, {"id": "qr_start_self", "title": "«Если жизнь плоха — почему бы не начать с себя?»", "tags": "самоубийство начни с себя промортализм", "text": "Из тезиса «не стоит создавать нового чувствующего субъекта» логически не следует «уже существующий человек обязан прекратить жизнь». У живущего уже сформированы привязанности, стремление к самосохранению и страх смерти, а его уход не остановит рождение и страдание других существ. Эфилизм — о предотвращении новых жертв, а не о давлении на живущих.\n\nПодробнее: https://bohdan19p-bit.github.io/efilism-faq/#q-32"}, {"id": "qr_redbutton", "title": "Что на самом деле означает «Красная кнопка»?", "tags": "красная кнопка мысленный эксперимент эмпатия", "text": "«Красная кнопка» — это философский мысленный эксперимент (как «проблема вагонетки»), а не план действий. Он проверяет не склонность к насилию, а ценностный приоритет: допустимо ли бесконечно продлевать биосферную мясорубку ради продолжения «игры». В реальной практике эфилизм опирается на просвещение, разумную демографию и снижение вреда.\n\nПодробнее: https://bohdan19p-bit.github.io/efilism-faq/#q-35"}, {"id": "qr_depressed", "title": "«Вы просто в депрессии / вам к психологу»", "tags": "депрессия ad hominem переход на личность", "text": "Переход на личность не опровергает аргумент. Даже если человек счастлив или, наоборот, подавлен, факты о природе боли, отсутствии согласия на рождение и масштабе страданий в природе от его настроения не меняются. Спорить имеет смысл с доводами, а не с воображаемым диагнозом собеседника."}]}, {"title": "🗺 «Как эфилизм хочет победить?» — практика и стратегия", "items": [{"id": "qr_how_win", "title": "Как эфилизм вообще может реализоваться на практике?", "tags": "практика стратегия победить дорожная карта демография", "text": "Эфилизм не рассчитывает на «волшебный щелчок». Практическая стратегия идёт по этапам: 1) просвещение и разрушение пронаталистических мифов; 2) доступное образование и медицина (в развитых странах рождаемость уже сама упала ниже уровня воспроизводства); 3) системное снижение вреда для людей и животных, ответственная этика ИИ и отказ от космической экспансии страданий.\n\nПодробнее в ЧаВО: https://bohdan19p-bit.github.io/efilism-faq/#q-46"}, {"id": "qr_memetics", "title": "«Антинаталисты не размножаются — эволюция вас отсеет!»", "tags": "эволюция меметика гены идеи отбор", "text": "Антинатализм и эфилизм передаются не генами, а культурой и аргументами (меметически). Никто не рождается математиком или атеистом по наследству — идеи распространяются через книги, видео и опыт. Более того, рождаемость во всех образованных обществах падает именно из-за культурного и рационального сдвига, а не генетики."}, {"id": "qr_climate", "title": "«Климат / войны / пандемии и так всё закончат»", "tags": "климат потепление пандемия вымирание", "text": "Это иллюзия. Глобальное потепление возвращает в атмосферу углерод, делая климат ближе к юрскому периоду — а тот был расцветом биосферы, а не её концом. Климатический коллапс разрушит цивилизацию и многократно усилит страдания, но не прекратит жизнь. Снижение вреда требует разума и стабильной цивилизации, а не катастроф."}, {"id": "qr_vegan", "title": "Обязательно ли быть веганом, чтобы быть эфилистом?", "tags": "веганство мясо животные этика", "text": "Логика сентиоцентризма прямо указывает, что сокращать прямое участие в страданиях животных — последовательный и важный шаг. При этом сам Гэри отмечает: люди несовершенны, и невеган может разделять принцип эфилизма, если понимает суть проблемы и обладает эмпатией. Главное — не оправдывать причинение вреда идеологически и двигаться к снижению страданий там, где это реально.\n\nРазбор в ЧаВО: https://bohdan19p-bit.github.io/efilism-faq/#q-28"}]}, {"title": "🎙 «А Гэри что говорит по поводу…» — позиции Inmendham", "items": [{"id": "qr_gary_benatar", "title": "Что Гэри говорит о Дэвиде Бенатаре?", "tags": "гэри бенатар отличие подкаст", "text": "Гэри уважает Бенатара как блестящего полемиста, но критикует его за две вещи: 1) Бенатар почти не строит аргументацию от лица животных (одной фразы в книге мало — проблема в самой жизни как явлении); 2) академическая отстранённость и пораженческая риторика («мы всё равно не победим»). Для Гэри это не холодный расчёт «58% против 47%», а безотлагательный этический вопрос."}, {"id": "qr_gary_violence", "title": "Что Гэри говорит о насилии и радикальном активизме?", "tags": "гэри насилие активизм супермаркет подкаст", "text": "В 7-м выпуске подкаста «Изучая антинатализм» Гэри прямо разграничивает диагноз и методы: «Эфилизм — это не инструкция по методам, а констатация факта». Он подчёркивает, что никогда не стал бы подстрекать к бессмысленному насилию («незачем плодить лишних жертв»), и не одобряет даже хамский активизм в супермаркетах, мешающий обычным людям."}, {"id": "qr_gary_planb", "title": "Что у Гэри считается «Планом Б»?", "tags": "гэри план б цивилизация снижение вреда", "text": "Гэри формулирует План «Б» максимально прагматично: если нельзя предотвратить плохой исход, нужно не допустить вдвойне худшего — действовать максимально разумно во всех сферах, сохранять цивилизацию и снижать вред там, где это возможно, не теряя из виду конечную цель."}, {"id": "qr_gary_community", "title": "Что Гэри говорит о крайностях в сообществе?", "tags": "гэри сообщество крайности активизм", "text": "Гэри предупреждает о двух одинаково опасных крайностях: холодной академической отстранённости (как у Бенатара) и чрезмерной личной болезненности, приносящей в движение эмоциональный хаос. «Нужно держаться посередине. Реальную ценность создаёт не массовость групп, а качественная систематическая работа»."}]}], "materials": [{"title": "🌐 Сайт и база знаний Efilism RUS (GitHub Pages)", "items": [{"id": "mat_start", "title": "Начать здесь — единый хаб проекта", "desc": "Главная точка входа со всеми разделами, книгой, ЧаВО, Вики и Атласом.", "url": "https://bohdan19p-bit.github.io/efilism-faq/start.html", "copy": "🧭 Единый навигатор по базе знаний Efilism RUS:\nhttps://bohdan19p-bit.github.io/efilism-faq/start.html"}, {"id": "mat_book", "title": "3D-витрина монографии (2-е изд., 2026)", "desc": "534 стр. RU / 478 EN / 500 UK · 7 частей, 49 глав, 19 схем, 185 источников.", "url": "https://bohdan19p-bit.github.io/efilism-faq/book.html", "copy": "📖 Монография «Эфилизм: Философия абсолютного антинатализма» (2-е изд., 2026 — RU / EN / UK):\nhttps://bohdan19p-bit.github.io/efilism-faq/book.html"}, {"id": "mat_concept", "title": "Концепт эфилизма за 5 минут", "desc": "Короткое ясное введение для тех, кто впервые слышит об эфилизме.", "url": "https://bohdan19p-bit.github.io/efilism-faq/concept.html", "copy": "⚡ Суть эфилизма за 5 минут (короткое введение):\nhttps://bohdan19p-bit.github.io/efilism-faq/concept.html"}, {"id": "mat_faq", "title": "Большой ЧаВО (55 вопросов с поиском)", "desc": "Полный интерактивный справочник ответов на главные вопросы и возражения.", "url": "https://bohdan19p-bit.github.io/efilism-faq/", "copy": "❓ Большой ЧаВО по эфилизму (55 вопросов и ответов с поиском):\nhttps://bohdan19p-bit.github.io/efilism-faq/"}, {"id": "mat_glossary", "title": "Глоссарий (45 ключевых терминов)", "desc": "Точные определения понятий монографии и философии эфилизма.", "url": "https:// .7): Полная навигация по тезисам, аргументам, графу связей и привязке к стра...", "text": "🧭 Исследовательский атлас Efilism RUS (v3.7):\nПолная навигация по тезисам, аргументам, графу связей и привязке к страницам монографии 2026 года.\nhttps://bohdan19p-bit.github.io/efilism-atlas/"}, {"id": "rose_book", "cmd": "#book", "name": "book", "preview": "📖 Монография «Эфилизм: Философия абсолютного антинатализма» (2-е изд., 2026) 534 стр. (RU) / 478 (EN) / 500 (UK) · 7 ...", "text": "📖 Монография «Эфилизм: Философия абсолютного антинатализма» (2-е изд., 2026)\n534 стр. (RU) / 478 (EN) / 500 (UK) · 7 частей, 49 глав, 19 схем, 185 источников.\n\n• Интерактивная 3D-витрина книги: https://bohdan19p-bit.github.io/efilism-faq/book.html\n• Пост с доступом и форматами (PDF / EPUB / FB2 / аудио): https://t.me/efilism_RUS/1093"}, {"id": "rose_faq", "cmd": "#faq", "name": "faq", "preview": "📚 *Полный справочник команд Efilism RUS*  🔎 Интерактивный Большой ЧаВО (55 вопросов с поиском): https://bohdan19p-bit...", "text": "📚 *Полный справочник команд Efilism RUS*\n\n🔎 Интерактивный Большой ЧаВО (55 вопросов с поиском):\nhttps://bohdan19p-bit.github.io/efilism-faq/\n\nГлавное меню: #nav | Быстрый старт: #start | Анти-мифы: #fakes\n\n• *Ядро и позиции:* #efilism #antinatalism #core #pessimism #negativeutilitarianism #promortalism #childfree\n• *Истина и метод:* #objectivetruth #objectivevalue #subjectivity #moralrealism #criticism #steelman #field_method #adhominem #scarecrow\n• *Субъект и вред:* #sentience #valence #harm #suffering #pain #nociception\n• *Создание и риск:* #creation #risk #norisk #need #consent #benefit #asymmetry #sufferingasymmetry #sufferingbalance #threshold #metarationality #natalismburdenofproof #hedoniccalculator #futureperson #potentialperson #nonexistence\n• *Причинность и биология:* #evolution #selection #dna #replication #replicationaldelusion #survival #determinism #freewill #lottery #wildnature #harmreduction\n• *Благополучие и возражения:* #wellbeing #adaptation #wanting #pleasure #goodlife #happy #optimism #survivorshipbias #love #meaning #meanisnotenough #growth #sufferingisnecessary #lifegift #mychild #parents #parenthood #adopt #natural #humanitywilldie\n• *Существующие субъекты и стратегия:* #death #autonomy #violence #extinction #depression #roadmap #guarantee #memetics #ai_sentience #transhumanism #digitalimmortality\n• *Книга, архивы и правила:* #book #sources #materials #glossary #quiz #admins (`/rules`)"}, {"id": "rose_glossary", "cmd": "#glossary", "name": "glossary", "preview": "📖 *Ключевые термины монографии (ред. 2026)*  • *Субъект vs Агент (#sentience):* субъект переживает опыт (боль/благо),...", "text": "📖 *Ключевые термины монографии (ред. 2026)*\n\n• *Субъект vs Агент (#sentience):* субъект переживает опыт (боль/благо), агент действует по целям и алгоритмам.\n• *Ноцицепция vs Боль (#nociception #pain):* нейронный сигнал угрозы против сознательного страдания с отрицательной валентностью.\n• *Участнический vs Конститутивный риск (#risk):* риск существующего человека ради своих целей против риска, создающего самого носителя ставки.\n• *Метарациональность (#metarationality):* проверка самого генератора проблем, а не только ремонт отдельных поломок внутри него.\n• *Эндогенная самоавторизация (#need):* круговое оправдание запуска нужды тем, что часть созданных дефицитов затем удовлетворяется.\n• *Создание vs Продолжение (#death #promortalism):* до зачатия нет субъекта и нужды; после рождения есть актуальные интересы, планы и право на защиту.\n\n🔎 Полный интерактивный глоссарий на 45 понятий с поиском:\nhttps://bohdan19p-bit.github.io/efilism-faq/glossary.html\n\nМеню команд: #nav | #start"}, {"id": "rose_materials", "cmd": "#materials", "name": "materials", "preview": "📚 Единая база знаний Efilism RUS: • Начать здесь (единый хаб): https://bohdan19p-bit.github.io/efilism-faq/start.html...", "text": "📚 Единая база знаний Efilism RUS:\n• Начать здесь (единый хаб): https://bohdan19p-bit.github.io/efilism-faq/start.html\n• 3D-витрина монографии (2026): https://bohdan19p-bit.github.io/efilism-faq/book.html\n• Концепт за 5 минут: https://bohdan19p-bit.github.io/efilism-faq/concept.html\n• Большой ЧаВО (55 вопросов): https://bohdan19p-bit.github.io/efilism-faq/\n• Глоссарий (45 терминов): https://bohdan19p-bit.github.io/efilism-faq/glossary.html\n• Адаптированная Вики: https://bohdan19p-bit.github.io/efilism-faq/wiki.html\n• Исследовательский атлас v3.7: https://bohdan19p-bit.github.io/efilism-atlas/"}, {"id": "rose_nav", "cmd": "#nav", "name": "nav", "preview": "🧭 *Главное меню базы знаний Efilism RUS*  *Быстрый старт и сайт:* • #start — единый хаб, Концепт (5 мин), ЧаВО (55), ...", "text": "🧭 *Главное меню базы знаний Efilism RUS*\n\n*Быстрый старт и сайт:*\n• #start — единый хаб, Концепт (5 мин), ЧаВО (55), Глоссарий (45)\n• #efilism #core — суть позиции и доказательное ядро\n• #fakes — быстрый разбор главных мифов и вбросов\n\n*Основные разделы команд:*\n1. Ядро и позиции: #antinatalism #pessimism #negativeutilitarianism #promortalism #childfree\n2. Метод и спор: #steelman #field_method #criticism #adhominem #scarecrow\n3. Субъект и риск: #sentience #valence #pain #asymmetry #threshold #risk\n4. Биология и природа: #evolution #dna #wildnature #harmreduction #determinism\n5. Живущие субъекты: #wellbeing #autonomy #violence #death #extinction\n6. Стратегия и будущее: #roadmap #guarantee #memetics #technology\n7. Книга и архивы: #book #sources #materials #glossary #quiz\n8. Правила и модерация: `/rules` | #admins\n\nПолный список всех команд: #faq"}, {"id": "rose_quiz", "cmd": "#quiz", "name": "quiz", "preview": "🎯 *Тренажёр и проверка знаний Efilism RUS*  Хотите проверить, насколько точно вы отличаете аргументы эфилизма от быто...", "text": "🎯 *Тренажёр и проверка знаний Efilism RUS*\n\nХотите проверить, насколько точно вы отличаете аргументы эфилизма от бытовых карикатур и ловушек в споре?\n\nПереходите в специальный раздел форума *«🎯 Тренажёр: основы и тонкости»* — там собраны карточки-кейсы с вариантами ответов и подробным разбором под спойлером по главам книги 2026 года.\n\nБазовые команды для самопроверки: #core #field_method #steelman #criticism #nav"}, {"id": "rose_roadmap", "cmd": "#roadmap", "name": "roadmap", "preview": "🗺 *Дорожная карта и стратегия эфилизма (5 этапов)*  Достижение целей эфилизма строится на трезвом учёте статус-кво, о...", "text": "🗺 *Дорожная карта и стратегия эфилизма (5 этапов)*\n\nДостижение целей эфилизма строится на трезвом учёте статус-кво, отказе от пораженчества и использовании законных информационных, институциональных и технологических рычагов:\n\n1️⃣ *Кодификация и база (Статус-кво):* создание строгой доказательной базы (книга, научный аппарат), очистка позиции от карикатур, развитие площадок, сообществ и алгоритмов распространения.\n2️⃣ *Информационный снежный ком (Критическая масса):* мирное просвещение и образование вместо агрессии, привлечение профильных специалистов (учёных, врачей, юристов, ИТ/ИИ-инженеров, авторов), депатологизация антинатализма в культуре.\n3️⃣ *Институционализация и окна возможностей:* работа строго в рамках закона и свободы слова — собственные медиа, исследовательские центры и поддержка реформ, снижающих страдание (доступная контрацепция, секс-просвет, репродуктивная свобода, паллиативная помощь, право на выход, снижение вреда в природе).\n4️⃣ *Эпистемическая и технологическая эволюция:* смена поколенческих установок (переход от биоцентризма к метакогниции) и использование нечувствующего ИИ/автоматизации для безопасного демографического перехода без обрушения инфраструктуры ухода.\n5️⃣ *Цивилизационный консенсус:* осознанный, демократический и компетентный выход из репликационного цикла через зрелость разума, а не через принуждение или катастрофу.\n\nСм. также: #guarantee #memetics #extinction #technology #nav"}, {"id": "rose_sources", "cmd": "#sources", "name": "sources", "preview": "*Справочный аппарат и источники книги* — библиография и доказательная карта монографии (с. 820–843) строго разделяют ...", "text": "*Справочный аппарат и источники книги* — библиография и доказательная карта монографии (с. 820–843) строго разделяют два класса материалов:\n\n1. *Научные и академические источники (коды S01–S145):* первичные работы по нейронауке боли и валентности (IASP, Метцингер, Берридж, Сет), аналитической этике создания и риска (Бенатар, Шиффрин, Вайнберг, Фрик, Макмахан, Парфит, Вассерман, Скэнлон, Ролз, Мориока), биологии и благополучию диких животных (Меллор, Фрейзер, Крамп), статистике медицины и демографии (ВОЗ, IARC, CDC, ОЭСР, ООН), а также русско- и украиноязычной рецепции (Шелест, Додонова, Сидорова, Саттар).\n2. *Генеалогические источники (коды G01–G09):* архивные материалы Гэри (Inmendham), Efilism Wiki и Philosophy Arena. Они фиксируют историю терминов и происхождение идей, но никогда не выдаются за независимое научное доказательство.\n\nСм. также: #book #criticism #steelman #materials"}, {"id": "rose_start", "cmd": "#start", "name": "start", "preview": "🧭 *Навигация по проекту Efilism RUS*  • Единый хаб (все ссылки, соцсети, книга): https://bohdan19p-bit.github.io/efil...", "text": "🧭 *Навигация по проекту Efilism RUS*\n\n• Единый хаб (все ссылки, соцсети, книга): https://bohdan19p-bit.github.io/efilism-faq/start.html\n• Концепт эфилизма за 5 минут: https://bohdan19p-bit.github.io/efilism-faq/concept.html\n• Большой ЧаВО с поиском (55 вопросов): https://bohdan19p-bit.github.io/efilism-faq/\n• Глоссарий терминологии (45 понятий): https://bohdan19p-bit.github.io/efilism-faq/glossary.html\n• Книга-монография и Приватный канал: https://t.me/efilism_RUS/1093\n\nКоманды бота: #nav | #faq | #materials | #fakes"}, {"id": "rose_wiki", "cmd": "#wiki", "name": "wiki", "preview": "🌐 Адаптированная русская Вики по эфилизму (6 разделов, 12 сильных возражений): Главная, Философская арена, Объективна...", "text": "🌐 Адаптированная русская Вики по эфилизму (6 разделов, 12 сильных возражений):\nГлавная, Философская арена, Объективная ценность, Объективная истина, FAQ и разбор сильных возражений.\nhttps://bohdan19p-bit.github.io/efilism-faq/wiki.html"}]}, {"title": "⚖️ Ядро, термины и аргументы", "items": [{"id": "rose_antinatalism", "cmd": "#antinatalism", "name": "antinatalism", "preview": "*Антинатализм* — семейство философских позиций, согласно которым намеренное создание новых людей или всех чувствующих...", "text": "*Антинатализм* — семейство философских позиций, согласно которым намеренное создание новых людей или всех чувствующих существ морально неоправданно либо недопустимо (гл. 31–33). В книге различается лестница позиций: от ситуативного отказа и антропоцентрического антинатализма до *абсолютного антинатализма* в эфилизме. «Абсолютность» здесь означает отсутствие видовых и субстратных исключений: один и тот же стандарт проверки риска и авторизации применяется к созданию любого субъекта переживания (человека, животного, возможной искусственной или постбиологической системы), способного к отрицательной валентности.\n\nСм. также: #efilism #sentience #creation #ai_sentience"}, {"id": "rose_arguments", "cmd": "#arguments", "name": "arguments", "preview": "⚖️ *Раздел: Центральные аргументы и этика риска*  Нормативное ядро книги (Части VI–VII, гл. 28–33) проверяет, существ...", "text": "⚖️ *Раздел: Центральные аргументы и этика риска*\n\nНормативное ядро книги (Части VI–VII, гл. 28–33) проверяет, существует ли достаточная нормативная авторизация для действия, которое впервые создаёт самого носителя потребностей и защищённого риска.\n\n• *Создание и нужда:* #core #creation #need #metarationality #futureperson #potentialperson #nonexistence\n• *Риск и защитный порог:* #risk #norisk #threshold #natalismburdenofproof\n• *Согласие, блага и асимметрия:* #consent #benefit #asymmetry #sufferingasymmetry #sufferingbalance #hedoniccalculator\n\nНазад к меню: #nav"}, {"id": "rose_asymmetry", "cmd": "#asymmetry", "name": "asymmetry", "preview": "*Асимметрия создания и непричинения* — при создании возникает чувствующий субъект, для которого открываются и возможн...", "text": "*Асимметрия создания и непричинения* — при создании возникает чувствующий субъект, для которого открываются и возможные блага, и риск тяжёлого вреда; при воздержании от создания не остаётся субъекта, который переживал бы отсутствие своей биографии как лишение или ущерб (гл. 26, 31–33, Приложение B, п. 2, 3, 5). В отличие от ранней формулировки Дэвида Бенатара, доказательное ядро книги не требует сравнивать существование субъекта с его «состоянием в небытии» и учитывает проблему неидентичности Дерека Парфита: ответственность за создание оценивается по допустимости самого действия, открывающего новую уязвимую биографию без предшествующей нужды.\n\nСм. также: #need #benefit #creation #threshold"}, {"id": "rose_basics", "cmd": "#basics", "name": "basics", "preview": "🧠 *Раздел: Основы, эпистемология и субъект переживания*  В книге «Эфилизм» (Части I, II и IV) аргументация строится п...", "text": "🧠 *Раздел: Основы, эпистемология и субъект переживания*\n\nВ книге «Эфилизм» (Части I, II и IV) аргументация строится по последовательной лестнице: от фаллибилистского реализма и дисциплины объяснения — через безличную причинность — к появлению внутренней перспективы (сентиентности), валентности и переживаемого вреда.\n\n• *Определения и смежные позиции:* #efilism #antinatalism #core #pessimism #negativeutilitarianism #promortalism #childfree\n• *Истина, ценность и метод:* #objectivetruth #objectivevalue #subjectivity #moralrealism #criticism\n• *Субъект, боль и вред:* #sentience #valence #harm #suffering #pain #nociception\n\nНазад к меню: #nav"}, {"id": "rose_consent", "cmd": "#consent", "name": "consent", "preview": "*Согласие и неустранимая односторонность* — добровольное информированное согласие способного субъекта является одним ...", "text": "*Согласие и неустранимая односторонность* — добровольное информированное согласие способного субъекта является одним из главных способов авторизации серьёзного риска (гл. 30–32, Приложение B, п. 4, 21). В книге отвергается упрощённый лозунг «нет согласия — значит любое действие запрещено»: существующего человека без сознания допустимо спасать без предварительного согласия, поскольку защищается его *уже существующий интерес*. При создании нового субъекта отсутствуют сразу оба канала: предварительное согласие логически невозможно, а предшествующего интереса, требующего спасения от небытия, не существует. Эта односторонность перекладывает особое бремя обоснования на инициатора.\n\nСм. также: #creation #risk #need #threshold"}, {"id": "rose_core", "cmd": "#core", "name": "core", "preview": "*Минимальное ядро эфилизма (Каноническая схема)* — центральный вывод книги (Введение; гл. 32–33, Приложение A) опирае...", "text": "*Минимальное ядро эфилизма (Каноническая схема)* — центральный вывод книги (Введение; гл. 32–33, Приложение A) опирается на 4 базовых положения и формальную схему защитного порога *P1–P4 → C*, не зависящую от спорной космологии или тотального депривационализма:\n\n• *P1 (Вес крайнего вреда):* крайне тяжёлое отрицательно валентное состояние (профиль L*) создаёт сильное первоначальное основание против действия, открывающего для другого практически значимый риск такого состояния.\n• *P2 (Структура оправдания риска):* допустимость риска зависит не только от ожидаемой суммы благ, но и от тяжести проигрыша, его распределения, обратимости, контролируемости, согласия и наличия предшествующего интереса затрагиваемого.\n• *P3 (Антижертвенный защитный порог):* когда действие впервые конституирует самого носителя ставки, не спасает его от предшествующей беды и не имеет его согласия, рост создаваемых благ сам по себе не авторизует назначение защищённого крайнего риска.\n• *P4 (Эмпирическое условие):* для известных биологических форм рождения класс крайне тяжёлого вреда структурно не устранён даже в самых благоприятных условиях.\n• *Вывод (C):* при отсутствии независимого сильного канала авторизации нормативно обоснованным решением является воздержание от создания нового субъекта риска.\n\nСм. также: #efilism #threshold #risk #creation"}, {"id": "rose_creation", "cmd": "#creation", "name": "creation", "preview": "*Проблема создания нового субъекта* — центральный вопрос репродуктивной этики книги (Введение; гл. 31–33): что способ...", "text": "*Проблема создания нового субъекта* — центральный вопрос репродуктивной этики книги (Введение; гл. 31–33): что способно нормативно оправдать намеренное создание нового субъекта переживания, когда до действия не существовало того, кому требовалось появиться, а само решение конституирует нового носителя нужд, уязвимости и риска? В отличие от медицины или спасения, где помощь отвечает на уже возникшую беду существующего человека, создание не выводит нерождённого из «плохого состояния небытия», а впервые открывает всю биографическую траекторию со всеми её возможными исходами.\n\n📂 *Команды раздела «👶 Создание»:* #risk #need #consent #benefit #asymmetry #threshold #metarationality #nav"}, {"id": "rose_efilism", "cmd": "#efilism", "name": "efilism", "preview": "*Эфилизм* — натуралистическая философская система абсолютного антинатализма с универсальным этическим критерием для в...", "text": "*Эфилизм* — натуралистическая философская система абсолютного антинатализма с универсальным этическим критерием для всех чувствующих субъектов (Введение; гл. 32–33). Эфилизм прослеживает возникновение переживаемого вреда от безличной причинной структуры реальности через самоподдерживающуюся жизнь, архитектуру нужды, сентиентность и отрицательную валентность. В нормативном плане это сентиоцентрическая плюралистическая этика создания, ориентированная на предотвращение тяжёлого вреда и защиту автономии уже существующих существ. В Efilism RUS позиция рассматривается как фаллибилистская (исправимая) система аргументов, открытая для проверки и критики, а не как набор догм.\n\nСм. также: #antinatalism #core #criticism #book\n\n🧭 Концепт за 5 минут: https://bohdan19p-bit.github.io/efilism-faq/concept.html\n🔎 Большой ЧаВО (55 вопросов): https://bohdan19p-bit.github.io/efilism-faq/"}, {"id": "rose_efilism2", "cmd": "#efilism2", "name": "efilism2", "preview": "Эфилизм можно рассматривать как продолжение идей сентиоцентрического антинатализма, расширенное критикой отрицательно...", "text": "Эфилизм можно рассматривать как продолжение идей сентиоцентрического антинатализма, расширенное критикой отрицательной валентности, вреда, эволюционной уязвимости и механизмов воспроизводства чувствующей жизни. Эфилизм не тождествен промортализму и не требует утверждения, что смерть существующих субъектов всегда лучше их жизни."}, {"id": "rose_extinction", "cmd": "#extinction", "name": "extinction", "preview": "*Прекращение воспроизводства и демографический переход* — в книге строго разводятся три разных вопроса: индивидуально...", "text": "*Прекращение воспроизводства и демографический переход* — в книге строго разводятся три разных вопроса: индивидуальное завершение жизни, добровольное сокращение репродукции и гипотетические сценарии глобального предохранителя (гл. 41, 44, 46–47). Отказ от создания новых носителей риска совместим с обязанностью защищать уже существующих людей от институционального обрушения: зрелый демографический переход требует перестройки систем ухода, медицины, пенсионной базы и инфраструктуры так, чтобы ни будущие дети не назначались обязанным трудовым резервом, ни живущие люди не оставались брошенными в старости и болезни.\n\nСм. также: #death #violence #technology #ai_sentience"}, {"id": "rose_guarantee", "cmd": "#guarantee", "name": "guarantee", "preview": "🛡 *Проблема гарантий: «Почему усилия не напрасны?»*  Требование «стопроцентной предварительной гарантии глобальной по...", "text": "🛡 *Проблема гарантий: «Почему усилия не напрасны?»*\n\nТребование «стопроцентной предварительной гарантии глобальной победы» как условия для действия опирается на две логические ошибки:\n\n1. *Смешение детерминизма с фатализмом (#determinism):* будущее не записано заранее в книге судьбы. В причинном мире ни один исторический сдвиг (отмена рабства, права человека, научная медицина, снижение детской смертности) не имел предварительной гарантии успеха в начале пути. Шанс создаётся только тогда, когда знание, аргумент и организация сами входят в причинную цепь как действующие факторы («иные причины — иной исход»).\n2. *Обесценивание локального предотвращённого вреда:* в сентиоцентрической этике не работает принцип «всё или ничего». Каждое предотвращённое рождение нового носителя риска, каждый человек, получивший доступ к обезболиванию или контрацепции, и каждый сохранённый строгий аргумент уже реально сокращают объём страдания в мире здесь и сейчас.\n\nЕдинственный способ гарантировать стопроцентное поражение — отказаться от системной работы из-за отсутствия готовых гарантий.\n\nСм. также: #roadmap #memetics #determinism #metarationality"}, {"id": "rose_harm", "cmd": "#harm", "name": "harm", "preview": "*Вред и уровни повреждения* — в книге разводятся четыре ступени причинной цепи: 1) физическое изменение структуры; 2)...", "text": "*Вред и уровни повреждения* — в книге разводятся четыре ступени причинной цепи: 1) физическое изменение структуры; 2) функциональное повреждение (сбой работы системы); 3) ноцицепция (нейронное кодирование угрозы); 4) *переживаемый вред* — состояние с отрицательной валентностью для чувствующего субъекта (гл. 22–23). В широком этическом смысле вред уже существующему субъекту включает актуальное отрицательное переживание, разрушение способностей, нарушение устойчивого интереса и лишение доступного блага. Повреждение ткани под глубокой анестезией может происходить без текущей боли, а тяжёлый переживаемый вред (фантомная боль, паника, горе) — без нового тканевого повреждения.\n\nСм. также: #valence #suffering #pain #nociception"}, {"id": "rose_harmreduction", "cmd": "#harmreduction", "name": "harmreduction", "preview": "Эфилистская критика создания новых чувствующих субъектов не равна требованию причинять вред уже существующим субъекта...", "text": "Эфилистская критика создания новых чувствующих субъектов не равна требованию причинять вред уже существующим субъектам. Напротив, снижение боли и страдания уже существующих существ может рассматриваться как отдельная практическая задача. Непричинение нового вреда и уменьшение уже существующего вреда — связанные, но логически разные задачи."}, {"id": "rose_metarationality", "cmd": "#metarationality", "name": "metarationality", "preview": "*Метарациональность и генератор проблем* — в книге (гл. 24, 28–29, Приложение A) различаются три уровня работы разума...", "text": "*Метарациональность и генератор проблем* — в книге (гл. 24, 28–29, Приложение A) различаются три уровня работы разума: 1) *локальная коррекция* (устранить конкретный экземпляр боли или голода у существующего субъекта); 2) *анализ механизма* (понять причинную цепь болезни или угрозы); 3) *метарациональность* — проверка самого *генератора проблем*, то есть архитектуры, которая снова и снова производит новых уязвимых субъектов, нуждающихся в ремонте. Успешное лечение пациента или кормление голодного — безусловное благо для уже живущего, но использование успешного ремонта как довода для создания новых пациентов образует круговую *ошибку эндогенной самоавторизации (M1)*.\n\nСм. также: #need #arguments #wellbeing #technology"}, {"id": "rose_moralrealism", "cmd": "#moralrealism", "name": "moralrealism", "preview": "Эфилизм не обязан исходить из морального реализма. Его аргументация может начинаться с фактов о чувствующих субъектах...", "text": "Эфилизм не обязан исходить из морального реализма. Его аргументация может начинаться с фактов о чувствующих субъектах, их состоянии и отрицательной валентности, а затем отдельно обосновывать нормативный вывод. Поэтому отрицание объективных моральных фактов само по себе не опровергает описание страдания или аргументы о риске его создания; оно ставит отдельный вопрос о том, какое нормативное основание связывает эти факты с практическим выводом."}, {"id": "rose_need", "cmd": "#need", "name": "need", "preview": "*Отсутствие предшествующей нужды и созданная нужда* — до создания субъекта нет никого, кто испытывает потребность в р...", "text": "*Отсутствие предшествующей нужды и созданная нужда* — до создания субъекта нет никого, кто испытывает потребность в рождении, скучает по будущим благам или страдает от их отсутствия (гл. 18, 26, 29, 31–32). Как показал Иоганн Фрик, само по себе отсутствие причины создавать счастливого человека ещё не даёт запрета — поэтому в книге этот тезис соединяется с этикой навязываемого риска и критикой *эндогенной самоавторизации*: нельзя оправдывать запуск генератора нужд тем, что после запуска часть созданных им же дефицитов (голода, болезни, уязвимости) будет успешно удовлетворяться или ремонтироваться.\n\nСм. также: #creation #asymmetry #metarationality #wellbeing"}, {"id": "rose_negativeutilitarianism", "cmd": "#negativeutilitarianism", "name": "negativeutilitarianism", "preview": "Негативный утилитаризм — разновидность консеквенциализма, при которой приоритет отдаётся минимизации страдания и несч...", "text": "Негативный утилитаризм — разновидность консеквенциализма, при которой приоритет отдаётся минимизации страдания и несчастья. В отличие от классического утилитаризма, положительные состояния не обязательно обладают симметричным весом по отношению к отрицательным. Эфилизм может пересекаться с негативным утилитаризмом, но не сводится к нему."}, {"id": "rose_norisk", "cmd": "#norisk", "name": "norisk", "preview": "Для обычного человеческого рождения невозможно заранее гарантировать отсутствие тяжёлого неблагоприятного исхода. Нел...", "text": "Для обычного человеческого рождения невозможно заранее гарантировать отсутствие тяжёлого неблагоприятного исхода. Нельзя с полной уверенностью исключить болезнь, хроническую боль, психическое страдание, насилие, несчастный случай, тяжёлую утрату или другие формы вреда на протяжении жизни. Поэтому нормативный вопрос нельзя свести к созданию «счастливого человека» в идеализированных условиях. Речь идёт о реальном создании субъекта в мире, где тяжёлые отрицательные исходы являются возможными и заранее не исключены."}, {"id": "rose_objectivetruth", "cmd": "#objectivetruth", "name": "objectivetruth", "preview": "Объективность утверждения не означает абсолютную безошибочность того, кто его выдвигает. Эфилизм допускает ошибку и в...", "text": "Объективность утверждения не означает абсолютную безошибочность того, кто его выдвигает. Эфилизм допускает ошибку и возможность опровержения. Вопрос заключается не в том, является ли сторонник эфилизма непогрешимым, а в том, выдерживают ли его конкретные аргументы проверку на логическую последовательность, эмпирические данные и возражения."}, {"id": "rose_objectivevalue", "cmd": "#objectivevalue", "name": "objectivevalue", "preview": "Объективная ценность и объективная мораль — не одно и то же. Можно утверждать, что определённое состояние объективно ...", "text": "Объективная ценность и объективная мораль — не одно и то же. Можно утверждать, что определённое состояние объективно является неблагоприятным для конкретного чувствующего субъекта, не утверждая тем самым существование универсальных моральных фактов. Утверждение «субъект испытывает тяжёлую отрицательную валентность» и утверждение «другие обязаны не создавать риск такого состояния» относятся к разным уровням аргументации. Первое требует обоснования факта и характера переживания, второе — дополнительного нормативного обоснования."}, {"id": "rose_pain", "cmd": "#pain", "name": "pain", "preview": "*Боль и феноменальный факт* — неприятное сенсорное и эмоциональное переживание, связанное с действительным или возмож...", "text": "*Боль и феноменальный факт* — неприятное сенсорное и эмоциональное переживание, связанное с действительным или возможным повреждением ткани либо сходное с ним (гл. 21–22; IASP). В книге действует *принцип феноменальной фиксации*: субъект может ошибаться в причине или локализации боли (как при фантомной боли), но ошибка в модели источника не превращает само состоявшееся переживание боли в иллюзию или отсутствие события. То, что боль имеет нейрофизиологический механизм и выполняет сигнальную функцию, объясняет, как именно возникает переживаемый вред, но не отменяет его внутреннюю цену.\n\nСм. также: #nociception #valence #harm #suffering"}, {"id": "rose_risk", "cmd": "#risk", "name": "risk", "preview": "*Риск создания (конститутивный риск)* — структурированная возможность неблагоприятных исходов, открываемая вместе с с...", "text": "*Риск создания (конститутивный риск)* — структурированная возможность неблагоприятных исходов, открываемая вместе с созданием нового чувствующего субъекта (гл. 27, 30–32, Приложение A). В книге риск описывается не одним процентом, а многомерным профилем R = ⟨q, h, r, c, d⟩: вероятностью/неопределённостью (q), тяжестью (h), обратимостью (r), контролируемостью (c) и распределением между субъектами (d). В отличие от *участнического риска* (принимаемого уже существующим человеком ради своих целей), при создании действует *конститутивный риск*: инициатор выбирает действие, а полный и необратимый диапазон последствий достаётся другому существу.\n\nСм. также: #creation #threshold #consent #benefit"}, {"id": "rose_sentience", "cmd": "#sentience", "name": "sentience", "preview": "*Сентиентность (чувствующий субъект)* — способность физической системы иметь субъективный опыт, то есть состояния, ко...", "text": "*Сентиентность (чувствующий субъект)* — способность физической системы иметь субъективный опыт, то есть состояния, которые существуют не только как внешняя регуляция или обработка сигналов, но и даны изнутри как ощущение, боль, страх или облегчение (гл. 19–20). В книге строго разводятся *субъект переживания* (тот, у кого есть внутренний опыт) и *агент* (система, инициирующая действия по информации, целям или правилам): младенец или животное являются субъектами переживания без полной рациональной агентности, а сложный алгоритм может быть агентом без внутреннего опыта. Моральная значимость (сентиоцентризм) определяется именно способностью к валентному опыту независимо от вида и физического носителя.\n\nСм. также: #valence #nociception #pain #ai_sentience"}, {"id": "rose_subjectivity", "cmd": "#subjectivity", "name": "subjectivity", "preview": "Субъективность переживания означает, что переживание существует для конкретного субъекта и имеет определённый характе...", "text": "Субъективность переживания означает, что переживание существует для конкретного субъекта и имеет определённый характер с его собственной точки зрения. Это не означает произвольность самого факта переживания. Боль может быть субъективным опытом конкретного существа, но утверждение «этот субъект испытывает боль» может быть истинным или ложным независимо от личного желания наблюдателя. Поэтому необходимо различать субъективность опыта и субъективность утверждения о факте этого опыта."}, {"id": "rose_suffering", "cmd": "#suffering", "name": "suffering", "preview": "*Страдание* — класс интенсивных, продолжительных или разрушительных отрицательно валентных состояний, которые захваты...", "text": "*Страдание* — класс интенсивных, продолжительных или разрушительных отрицательно валентных состояний, которые захватывают внимание, сужают автономию и подчиняют себе перспективу субъекта (гл. 22–23, 27). Книга различает *первичную отрицательность* (непосредственную боль, удушье, голод, истощение) и *вторичную отрицательность* (страх продолжения, беспомощность, утрату контроля и распад биографических планов). Не всякий лёгкий дискомфорт равен страданию: крайние неблагоприятные исходы образуют особый защищённый профиль проигрыша (L*), который нельзя механически приравнивать к мелким бытовым неудобствам.\n\nСм. также: #valence #harm #pain #threshold"}, {"id": "rose_sufferingasymmetry", "cmd": "#sufferingasymmetry", "name": "sufferingasymmetry", "preview": "При создании чувствующего субъекта появляется возможность страдания, которую до создания никто не переживает и не тре...", "text": "При создании чувствующего субъекта появляется возможность страдания, которую до создания никто не переживает и не требует предотвращать. При несоздании не существует субъекта, который страдает от того, что будущая жизнь не возникла. Это даёт асимметричный практический результат: можно предотвратить будущие страдания посредством непричинения, не создавая нового субъекта, тогда как предотвращение «упущенного удовольствия» предполагает создание того, для кого это удовольствие впоследствии стало бы благом. Поэтому отсутствие страдания и отсутствие удовольствия не имеют одинаковой структуры относительно акта создания."}, {"id": "rose_threshold", "cmd": "#threshold", "name": "threshold", "preview": "*Защитный порог крайне тяжёлого вреда* — антижертвенный нормативный принцип книги (гл. 30, 32–33, схема P1–P4 → C): с...", "text": "*Защитный порог крайне тяжёлого вреда* — антижертвенный нормативный принцип книги (гл. 30, 32–33, схема P1–P4 → C): существуют защищённые классы крайнего проигрыша (профиль L* — длительная агония, необратимое тяжёлое разрушение автономии и базовых условий благополучия), навязывание риска которых нельзя оправдать одним лишь увеличением ожидаемых создаваемых благ, если действие впервые создаёт самого носителя ставки, не спасает его от предшествующей беды и не авторизовано им самим. Высокая средняя вероятность благополучия в группе не превращает катастрофу отдельного проигравшего в «один процент боли».\n\nСм. также: #risk #benefit #core #arguments"}, {"id": "rose_valence", "cmd": "#valence", "name": "valence", "preview": "*Валентность* — внутренний положительный, отрицательный или нейтральный характер сознательного переживания для самого...", "text": "*Валентность* — внутренний положительный, отрицательный или нейтральный характер сознательного переживания для самого субъекта (гл. 20, 22). Отрицательная валентность (боль, удушье, паника, мучительная тоска) не является внешним ярлыком наблюдателя или спокойным вкусовым предпочтением: она встроена в сам феноменальный режим состояния как принудительное давление к прекращению, ослаблению или избеганию. Субъектная локальность такого опыта совместима с его объективной фактичностью: если субъекту мучительно, это объективное событие в мире, а не вопрос чьего-то мнения.\n\nСм. также: #sentience #harm #pain #suffering"}, {"id": "rose_wellbeing", "cmd": "#wellbeing", "name": "wellbeing", "preview": "*Благополучие и динамическая хрупкость ценности* — общее положение чувствующего субъекта с учётом качества его пережи...", "text": "*Благополучие и динамическая хрупкость ценности* — общее положение чувствующего субъекта с учётом качества его переживаний, интересов, способностей, автономии и защищённости (гл. 25–27). В книге выделяются два структурных свойства сознательного благополучия: 1) *рекурсивное формирование ставок (R1)* — обучение и положительный опыт создают новые привязанности и цели, расширяя карту возможной утраты; 2) *динамическая хрупкость (R2)* — накопленное в прошлом благо не становится физическим предохранителем от будущего разрушения тела, мозга или кластера жизненных опор.\n\n📂 *Команды раздела «😊 Благополучие»:*\n• *Опыт и мотивация:* #valence #benefit #adaptation #wanting #pleasure\n• *Счастье, любовь и смысл:* #goodlife #happy #optimism #survivorshipbias #love #meaning #meanisnotenough #growth #sufferingisnecessary\nНазад к меню: #nav"}]}, {"title": "🛡 Мифы и частые возражения", "items": [{"id": "rose_adopt", "cmd": "#adopt", "name": "adopt", "preview": "Усыновление отличается от рождения тем, что уже существующий ребёнок получает заботу и условия жизни без создания нов...", "text": "Усыновление отличается от рождения тем, что уже существующий ребёнок получает заботу и условия жизни без создания нового субъекта. Поэтому аргумент «если вы против рождения, значит вы против детей» является подменой тезиса. Критика создания новых субъектов не равна отказу помогать тем, кто уже существует."}, {"id": "rose_autonomy", "cmd": "#autonomy", "name": "autonomy", "preview": "*Право на выход, медицинская автономия и патернализм* — для уже существующего человека автономия (участие в решениях ...", "text": "*Право на выход, медицинская автономия и патернализм* — для уже существующего человека автономия (участие в решениях о собственном теле, лечении и продолжении жизни) является важнейшей частью благополучия (Часть XI, гл. 42–43). В книге «право на выход» рассматривается как философский предел внешней власти над человеком, а не призыв к смерти (#death). Оправданная процедура сталкивается с двумя классами необратимой ошибки: 1) трагическим решением в остром временном кризисе или под давлением социальной брошенности; 2) бессрочным принудительным удержанием человека в неприемлемом для него состоянии. Поэтому *пропорциональный патернализм* допустим лишь как временный предохранитель для проверки функциональной способности к решению, информированности и доступности помощи, а на случай утраты речи действует институт *предварительно выраженной воли*.\n\nСм. также: #death #violence #harm #wellbeing"}, {"id": "rose_benefit", "cmd": "#benefit", "name": "benefit", "preview": "*Будущие блага и граница авторизации* — книга полностью признаёт реальность положительных переживаний, любви, дружбы,...", "text": "*Будущие блага и граница авторизации* — книга полностью признаёт реальность положительных переживаний, любви, дружбы, творчества, а также понятия *несравнительного блага* (Джефф Макмахан) и ценности отношений (гл. 26, 30–33). Спор идёт не о том, бывают ли жизни счастливыми, а о разнице между *ценностью возможного результата* и *нормативным полномочием инициатора* (схема M2): тот факт, что благоприятная ветвь будет благом для возникшего человека, сам по себе не даёт права односторонне конституировать его вместе с остаточным риском крайнего непоправимого проигрыша. Последующее одобрение жизни созданным человеком — важное свидетельство удачного исхода, но не ретроспективная подпись каждого возможного участника под исходной ставкой (M5).\n\nСм. также: #wellbeing #asymmetry #threshold #steelman"}, {"id": "rose_childfree", "cmd": "#childfree", "name": "childfree", "preview": "Чайлдфри означает добровольное решение не иметь детей по личным причинам. Человек может быть чайлдфри без антинаталис...", "text": "Чайлдфри означает добровольное решение не иметь детей по личным причинам. Человек может быть чайлдфри без антинаталистических убеждений, а антинаталист может иметь дополнительные философские основания против рождения. Поэтому личное отсутствие желания иметь детей и философский аргумент против прокреации следует различать."}, {"id": "rose_death", "cmd": "#death", "name": "death", "preview": "*Смерть, существующие субъекты и промортализм* — критика создания новых чувствующих субъектов в эфилизме строго отдел...", "text": "*Смерть, существующие субъекты и промортализм* — критика создания новых чувствующих субъектов в эфилизме строго отделена от *промортализма* (тезиса, будто существующим людям лучше умереть) (гл. 31–33, 41–43, Приложение B, п. 10). До создания нет субъекта и его интересов; после появления человека возникают актуальные интересы, привязанности, проекты, страх утраты и собственная перспектива будущего. Вред смерти для уже живущего разделяется в книге на четыре структуры: процессуальный вред (мучительность умирания), депривационный вред (утрата доступного будущего), нарушение актуальных планов и реляционный вред близким и зависимым людям.\n\n📂 *Команды раздела «💀 Смерть и существующие субъекты»:*\n• *Смерть, автономия и помощь:* #autonomy #promortalism #depression #suicide #harmreduction\n• *Ненасилие и демографический переход:* #violence #extinction #harm\nНазад к меню: #nav"}, {"id": "rose_depression", "cmd": "#depression", "name": "depression", "preview": "Психологическое состояние сторонника позиции не определяет истинность её аргументов. Если человек ошибается в посылке...", "text": "Психологическое состояние сторонника позиции не определяет истинность её аргументов. Если человек ошибается в посылке или выводе, нужно показать ошибку в посылке или выводе. Объяснение философской позиции депрессией, неудовлетворённостью жизнью или личной биографией само по себе является аргументом о человеке, а не ответом на рассматриваемый тезис."}, {"id": "rose_futureperson", "cmd": "#futureperson", "name": "futureperson", "preview": "Будущий человек не существует до момента своего создания и поэтому не обладает предварительно существующей потребност...", "text": "Будущий человек не существует до момента своего создания и поэтому не обладает предварительно существующей потребностью быть созданным. После возникновения субъект приобретает собственные интересы, желания и основания для защиты его благополучия. Поэтому утверждение «этому ребёнку будет хорошо от того, что он родится» не показывает само по себе, что до рождения существовала потребность создать его ради него самого."}, {"id": "rose_goodlife", "cmd": "#goodlife", "name": "goodlife", "preview": "Даже очень хорошая жизнь не устраняет вопрос о разрешении самого создания. Для уже существующего человека её блага мо...", "text": "Даже очень хорошая жизнь не устраняет вопрос о разрешении самого создания. Для уже существующего человека её блага могут быть реальными и значимыми: он может любить, желать, радоваться, строить планы и считать своё существование хорошим. Но до его создания не существовал субъект, который был бы лишён именно этой жизни и нуждался бы в её получении. Поэтому утверждение «этому человеку хорошо жить» не тождественно утверждению «этого человека необходимо было создать». Антинаталистический вопрос возникает раньше: достаточно ли оснований для первоначального создания субъекта, если вместе с возможностью хорошей жизни создаётся и возможность тяжёлого вреда."}, {"id": "rose_growth", "cmd": "#growth", "name": "growth", "preview": "Страдание иногда может приводить к развитию, обучению или изменению поведения. Однако полезное последствие страдания ...", "text": "Страдание иногда может приводить к развитию, обучению или изменению поведения. Однако полезное последствие страдания не превращает само страдание автоматически в благо и не доказывает необходимость создавать субъектов, которым оно потенциально будет причинено. Нужно отдельно показать, что предполагаемая польза перевешивает риск и что этот риск допустимо навязывать."}, {"id": "rose_happy", "cmd": "#happy", "name": "happy", "preview": "Факт, что многие люди довольны своей жизнью, важен и не должен отрицаться. Но положительная оценка уже существующей ж...", "text": "Факт, что многие люди довольны своей жизнью, важен и не должен отрицаться. Но положительная оценка уже существующей жизни и оправданность первоначального создания — разные вопросы. После рождения у человека возникают отношения, проекты, привязанности и интерес к будущему. До рождения не существовало субъекта, который нуждался в получении этой жизни. Поэтому «я рад, что живу» не превращается автоматически в доказательство «меня было допустимо подвергнуть любому риску ради возможности такого результата»."}, {"id": "rose_hedoniccalculator", "cmd": "#hedoniccalculator", "name": "hedoniccalculator", "preview": "Гедонистический расчёт пытается сравнивать моральную ценность вариантов через количество удовольствия и страдания. Од...", "text": "Гедонистический расчёт пытается сравнивать моральную ценность вариантов через количество удовольствия и страдания. Однако точное количественное сравнение субъективных переживаний сталкивается с проблемами измерения, межсубъектного сравнения и выбора самой шкалы ценности. Поэтому числовой баланс удовольствия и страдания не является автоматически объективным математическим фактом."}, {"id": "rose_humanitywilldie", "cmd": "#humanitywilldie", "name": "humanitywilldie", "preview": "То, что человечество когда-либо исчезнет, само по себе ничего не говорит о моральной допустимости или недопустимости ...", "text": "То, что человечество когда-либо исчезнет, само по себе ничего не говорит о моральной допустимости или недопустимости рождения. Это может быть следствием множества разных сценариев. Нельзя опровергнуть аргумент против создания только утверждением о будущем исчезновении человечества: необходимо показать, почему само действие создания является оправданным."}, {"id": "rose_lifegift", "cmd": "#lifegift", "name": "lifegift", "preview": "Аргумент «жизнь — подарок» предполагает, что получатель уже существовал и мог хотеть или не хотеть этот подарок. До р...", "text": "Аргумент «жизнь — подарок» предполагает, что получатель уже существовал и мог хотеть или не хотеть этот подарок. До рождения такого получателя нет. Поэтому жизнь нельзя рассматривать как обычный подарок в том же смысле, что вещь, которую можно принять или вернуть. Возникает сам получатель подарка вместе со всеми связанными с этим рисками."}, {"id": "rose_lottery", "cmd": "#lottery", "name": "lottery", "preview": "Сравнение рождения с лотереей подчёркивает не наличие буквального денежного выигрыша, а структуру распределённого рис...", "text": "Сравнение рождения с лотереей подчёркивает не наличие буквального денежного выигрыша, а структуру распределённого риска. При создании нового субъекта заранее неизвестно, какие заболевания, травмы, утраты, формы насилия, психологические состояния и другие обстоятельства встретятся в его жизни. Поэтому аргумент «большинство получает хороший результат» не отвечает сам по себе на вопрос о допустимости навязывания риска каждому создаваемому субъекту. Для нормативного вывода необходимо дополнительно показать, почему вероятность и тяжесть неблагоприятных исходов находятся ниже порога, при котором такой риск допустимо создавать для другого."}, {"id": "rose_love", "cmd": "#love", "name": "love", "preview": "Любовь родителей к ребёнку может быть реальной ценностью для уже существующих людей, но её существование не доказывае...", "text": "Любовь родителей к ребёнку может быть реальной ценностью для уже существующих людей, но её существование не доказывает, что создание ребёнка было необходимо ради самого ребёнка. Нельзя автоматически использовать будущую любовь как оправдание риска, который одновременно создаётся для того же субъекта."}, {"id": "rose_meaning", "cmd": "#meaning", "name": "meaning", "preview": "Наличие смысла в жизни существующего человека не доказывает необходимость создания новых людей. Смысл может быть реал...", "text": "Наличие смысла в жизни существующего человека не доказывает необходимость создания новых людей. Смысл может быть реальным субъективным или интерсубъективным достижением уже существующего субъекта. Вопрос антинатализма возникает раньше: необходимо ли создавать нового субъекта, чтобы тот получил возможность искать или создавать смысл."}, {"id": "rose_meanisnotenough", "cmd": "#meanisnotenough", "name": "meanisnotenough", "preview": "Средняя оценка некоторого класса исходов не обязательно определяет допустимость каждого отдельного риска. Даже если с...", "text": "Средняя оценка некоторого класса исходов не обязательно определяет допустимость каждого отдельного риска. Даже если средняя человеческая жизнь оценивается положительно, распределение результатов может включать относительно небольшое число чрезвычайно тяжёлых исходов. Поэтому аргумент «в среднем люди счастливы» отвечает на статистический вопрос о среднем результате, но не автоматически на нормативный вопрос о допустимости создания каждого нового субъекта. Для такого вывода необходимо отдельно обосновать отношение к вероятности и тяжести крайних отрицательных исходов."}, {"id": "rose_mychild", "cmd": "#mychild", "name": "mychild", "preview": "Счастье конкретного существующего человека является фактом о его нынешнем состоянии и не должно отрицаться только рад...", "text": "Счастье конкретного существующего человека является фактом о его нынешнем состоянии и не должно отрицаться только ради антинаталистического вывода. Однако из того, что конкретный человек оказался счастливым, не следует автоматически, что сам акт его создания был оправдан. Для этого необходимо различать два вопроса: насколько хорошо субъекту после создания и было ли создание этого субъекта допустимым с учётом заранее неизвестных исходов. Благоприятный фактический результат не превращает автоматически рискованный способ его получения в оправданный."}, {"id": "rose_natalismburdenofproof", "cmd": "#natalismburdenofproof", "name": "natalismburdenofproof", "preview": "Бремя обоснования создания лежит на стороне, которая предлагает создать нового чувствующего субъекта. Это не означает...", "text": "Бремя обоснования создания лежит на стороне, которая предлагает создать нового чувствующего субъекта. Это не означает, что натализм заранее признан ложным, и не означает, что любой риск требует невозможной абсолютной гарантии безопасности. Требуется обосновать именно нормативное разрешение на создание субъекта в условиях, где вместе с возможностью благ возникают реальные риски боли, страдания, болезни, утраты и других форм тяжёлого вреда. Особенность ситуации в том, что до создания нет существующего субъекта, который нуждался бы в получении жизни или заранее соглашался бы принять связанные с ней риски. Поэтому аргумент «жизнь может быть хорошей» описывает возможный результат после создания, но сам по себе не устанавливает, почему создание было оправдано до его возникновения. Если наталист утверждает, что возможность будущих благ достаточна для оправдания создания, он должен показать, почему эти блага обладают достаточной разрешающей силой по отношению к риску тяжёлого вреда, который одновременно создаётся для того же субъекта. При отсутствии такого обоснования утверждение о возможной хорошей жизни остаётся описанием возможного исхода, а не доказательством допустимости самого акта создания."}, {"id": "rose_nonexistence", "cmd": "#nonexistence", "name": "nonexistence", "preview": "Небытие нельзя описывать как состояние, в котором кто-то страдает от отсутствия жизни. Если субъект не существует, не...", "text": "Небытие нельзя описывать как состояние, в котором кто-то страдает от отсутствия жизни. Если субъект не существует, нет переживающего субъекта, который испытывает скуку, сожаление, боль или лишение. Поэтому вопрос должен ставиться не как «кому хорошо в небытии?», а как «нужно ли создавать субъекта, который без этого создания вообще не существовал бы и не нуждался бы в получении благ?»."}, {"id": "rose_objections", "cmd": "#objections", "name": "objections", "preview": "🧩 *Раздел: Полевой метод и разбор возражений*  Каждое возражение против эфилизма и антинатализма сначала усиливается ...", "text": "🧩 *Раздел: Полевой метод и разбор возражений*\n\nКаждое возражение против эфилизма и антинатализма сначала усиливается до лучшей формы (#steelman), после чего проверяется через полевой метод (#field_method): какую именно посылку минимального ядра оно затрагивает.\n\n• *Метод и правила спора:* #field_method #steelman #criticism #adhominem #scarecrow #natalismburdenofproof\n• *Типовые аргументы натализма:* #lifegift #mychild #parents #parenthood #adopt #love #meaning #meanisnotenough #growth #sufferingisnecessary #goodlife #happy #optimism #survivorshipbias #natural #humanitywilldie\n\nНазад к меню: #nav"}, {"id": "rose_optimism", "cmd": "#optimism", "name": "optimism", "preview": "Оптимизм о собственной жизни не является доказательством того, что создание новых людей оправдано. Существующий челов...", "text": "Оптимизм о собственной жизни не является доказательством того, что создание новых людей оправдано. Существующий человек может считать свою жизнь хорошей и иметь множество причин продолжать её. Но из этого не следует, что будущему человеку необходимо навязать существование с неизвестным набором будущих исходов."}, {"id": "rose_parenthood", "cmd": "#parenthood", "name": "parenthood", "preview": "Родительские мотивы могут включать любовь, желание заботиться, стремление к смыслу, продолжению семьи или социальному...", "text": "Родительские мотивы могут включать любовь, желание заботиться, стремление к смыслу, продолжению семьи или социальному признанию. Однако наличие выгоды или эмоциональной ценности для родителей само по себе не доказывает морального права создавать нового субъекта и передавать ему риск будущего вреда."}, {"id": "rose_parents", "cmd": "#parents", "name": "parents", "preview": "Критика репродуктивного решения не требует считать родителей плохими людьми. Люди принимают решения под влиянием куль...", "text": "Критика репродуктивного решения не требует считать родителей плохими людьми. Люди принимают решения под влиянием культуры, биологии, социальных норм, личных обстоятельств и доступных им представлений. В Efilism RUS объектом философской критики является действие и его оправдание, а не человеческое достоинство родителей."}, {"id": "rose_pessimism", "cmd": "#pessimism", "name": "pessimism", "preview": "Эфилизм не сводится к тезису «всё плохо» или к эмоциональному пессимизму. Его аргументы можно формулировать независим...", "text": "Эфилизм не сводится к тезису «всё плохо» или к эмоциональному пессимизму. Его аргументы можно формулировать независимо от настроения говорящего: существует ли отрицательная валентность, как возникает чувствующий субъект, кто несёт риск создания, существует ли до рождения нужда в появлении и какие основания способны оправдать навязывание такого риска."}, {"id": "rose_pleasure", "cmd": "#pleasure", "name": "pleasure", "preview": "Удовольствие является реальным положительно валентным переживанием и эфилизм не обязан отрицать его существование. Во...", "text": "Удовольствие является реальным положительно валентным переживанием и эфилизм не обязан отрицать его существование. Вопрос состоит в другом: достаточно ли возможного удовольствия, возникающего после создания субъекта, чтобы оправдать создание самого субъекта и одновременно навязанный ему риск боли, болезни, утрат и других неблагоприятных состояний."}, {"id": "rose_potentialperson", "cmd": "#potentialperson", "name": "potentialperson", "preview": "Потенциальный человек не обладает теми же интересами, что уже существующий человек. У существующего субъекта интересы...", "text": "Потенциальный человек не обладает теми же интересами, что уже существующий человек. У существующего субъекта интересы основаны на реально существующем переживающем центре. Потенциальный субъект ещё не испытывает лишения, одиночества, боли или сожаления из-за того, что не существует. Поэтому ссылка на потенциальные интересы требует отдельного обоснования и не может автоматически иметь тот же вес, что интересы уже существующего субъекта."}, {"id": "rose_promortalism", "cmd": "#promortalism", "name": "promortalism", "preview": "Промортализм — это позиция, согласно которой смерть или прекращение жизни оценивается положительно по сравнению с про...", "text": "Промортализм — это позиция, согласно которой смерть или прекращение жизни оценивается положительно по сравнению с продолжением жизни. Антинатализм и промортализм различаются: антинатализм критикует создание новых субъектов, тогда как промортализм делает нормативное утверждение о смерти существующих субъектов. Эфилизм не следует автоматически отождествлять с промортализмом."}, {"id": "rose_sufferingbalance", "cmd": "#sufferingbalance", "name": "sufferingbalance", "preview": "Эфилистский аргумент не обязан доказывать, что у каждого человека суммарное страдание превышает удовольствие. Даже ес...", "text": "Эфилистский аргумент не обязан доказывать, что у каждого человека суммарное страдание превышает удовольствие. Даже если многие жизни в среднем оцениваются их носителями положительно, это не устраняет вопрос о распределении риска и тяжести возможных исходов. Средний положительный результат не объясняет автоматически, почему допустимо создавать каждого нового субъекта в условиях, где для него остаётся возможность крайне тяжёлого проигрыша. Если потенциальный вред достигает достаточно высокой тяжести, его нельзя просто исключить из анализа ссылкой
