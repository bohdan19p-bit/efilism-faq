ия и скрытый антинатализм", "thesis": "На прямых референдумах без диктата лоббистов люди трезво не захотят оплачивать налогами чужое безответственное родительство.", "quote": "«Пусть это и не чисто философский антинатализм, но люди просыпаются и трезво признают: \"Я не готов быть родителем и не хочу брать на себя такую ответственность\"»."}, {"id": "g_8", "title": "Почему после пандемии не будет бэби-бума", "thesis": "В условиях экономического спада и удорожания жизни заводить детей решаются лишь самые безрассудные.", "quote": "«Мы не идём вверх — мы идём вниз. Экономическую боль почувствуют все, жизнь станет намного дороже. Заводить детей в таких условиях станут лишь самые безрассудные»."}]}, {"title": "5. «Красная кнопка» и границы активизма", "items": [{"id": "g_9", "title": "Тест на глубину эмпатии и «красивые титры»", "thesis": "«Красная кнопка» проверяет осознание масштаба чужих страданий, а критика «имиджа» напоминает нежелание отключить аппарат при мёртвом мозге.", "quote": "«Все хотят сказочный финал с красивыми титрами. А нам не нужны красивые титры — нам нужно, чтобы на экране просто появилось слово \"Конец\". Фильм окончен»."}, {"id": "g_10", "title": "Против бессмысленного насилия и хамского активизма", "thesis": "Гэри отвергает подстрекательство к бессмысленному насилию и осуждает агрессивный активизм в магазинах.", "quote": "«Конечно, я никогда и никого не стал бы подстрекать к бессмысленному насилию. Если действие не выигрывает войну, незачем плодить лишних жертв... На улице на площади — пожалуйста, а в магазине не мешай людям»."}]}, {"title": "6. Диагноз, климат, дикая природа и План «Б»", "items": [{"id": "g_11", "title": "Эфилизм — констатация факта, а не инструкция", "thesis": "Сознание не решает никакой задачи Вселенной и лишь порождает страдание; мирный путь предпочтителен, но логика не зависит от толпы.", "quote": "«Эфилизм — это не инструкция по методам. Эфилизм — это констатация факта: существование чувствующей жизни на Земле является фундаментальной проблемой. Сознание не решает никакой задачи Вселенной и не залечивает никакой её раны, оно лишь порождает страдание»."}, {"id": "g_12", "title": "Пример с «Королём Львом» (8 львят ради 1 песенки)", "thesis": "Нельзя оправдать мучения восьми львят ради одного счастливого; со злом не мирятся — не дают опрокинуть стакан.", "quote": "«Если вывод таков, что жизнь — это зло, то что делают со злом? Его не кладут в карман на память — его предотвращают. Не вытирают лужу бесконечно, а не дают опрокинуть стакан»."}, {"id": "g_13", "title": "Почему потепление вернёт юрский период, а не вымирание", "thesis": "Выбросы углерода делают климат теплее и влажнее, разрушая цивилизацию и усиливая страдания, но не останавливая биосферу.", "quote": "«Юрский период был вовсе не концом жизни, а её расцветом! Глобальное потепление способно разрушить человеческую цивилизацию, вызвать войны и страдания, но оно не уничтожит ни жизнь, ни даже человечество»."}, {"id": "g_14", "title": "«Три лотереи подряд» и редкость сложной жизни", "thesis": "Возникновение сложной нервной системы крайне маловероятно и не повторится заново; сложная жизнь в космосе также чудовищно редка.", "quote": "«Это как выиграть в лотерею с шансом один к миллиарду, получить билет во вторую такую же лотерею, выиграть её, а затем выиграть и третью подряд... Сложная жизнь чудовищно редка — как семь ударов молнии в одну булавочную головку»."}, {"id": "g_15", "title": "Дикая природа и План «Б»", "thesis": "Медленная стерилизация растягивает страдания на столетия; План «Б» — сохранять цивилизацию и разумно снижать вред, не теряя цели.", "quote": "«Если нельзя предотвратить плохой исход, нужно хотя бы не допустить вдвойне худшего. Действовать максимально разумно во всех сферах жизни, сохранять цивилизацию, снижать вред там, где это возможно — но никогда не жертвовать конечной целью ради мелкого удобства в настоящем»."}]}, {"title": "7. Сообщество, крайности и язык", "items": [{"id": "g_16", "title": "Невеганы в эфилизме и две крайности активизма", "thesis": "Люди несовершенны — важен принцип и эмпатия; в активизме опасны и холодная отстранённость, и чрезмерная личная болезненность.", "quote": "«И если холодная отстранённость Бенатара — одна опасная крайность, то чрезмерная личная болезненность — другая, не менее опасная крайность. Нужно держаться посередине. Идеального порядка не бывает — даже протест против хаоса неизбежно получается немного хаотичным»."}, {"id": "g_17", "title": "Проблема языка и ошибка Бенджамина Франклина", "thesis": "«Сентиоцентрический антинатализм» — громоздкий термин; привязанность к неудачным словам похожа на езду со спущенными колёсами.", "quote": "«Это как ездить на машине со спущенными колёсами, потому что она уже есть... \"Антинатализм\" и \"сентиоцентризм\" не схватывают суть сразу. Нам нужен более ясный, точный язык»."}, {"id": "g_18", "title": "Финал: «Благодари логику»", "thesis": "На благодарность слушателей Гэри отвечает, что считает себя лишь инструментом логики.", "quote": "«Я просто инструмент. Благодари логику — благодари за то, что истину не всегда удаётся задушить чепухой. А меня не благодари, я на эту работу не напрашивался»."}]}], "constructive": [{"title": "1. Образование, просвещение и культура разума", "items": [{"id": "con_edu_1", "title": "Школьное образование как главный мягкий фактор", "desc": "Подкаст № 7; Разбор Бенатара, ч. 2", "text": "Гэри (Inmendham): «В случае с человечеством нам даже не нужно придумывать хитрые схемы: люди сами себя выведут, если просто дать им нормальное школьное образование. Во всех развитых странах рождаемость уже ниже уровня воспроизводства, население стареет и идёт к естественному угасанию»."}, {"id": "con_edu_2", "title": "Воспитывать более разумных людей (Better Humans)", "desc": "Ясная эмпатия вместо противоречивых мифов", "text": "Гэри (Inmendham), «Better Humans»: «Нам не нужно выводить \"улучшенную породу\" людей — нам нужно воспитывать и формировать более разумных людей. Никто не говорит ребёнку прямо: \"Твоя жизнь имеет значение потому, что ты способен чувствовать боль и страдать. И точно так же, как боль плоха для тебя, она плоха для любого другого чувствующего существа\"»."}, {"id": "con_edu_3", "title": "Образование и право выбора для женщин в бедных странах", "desc": "Подкаст № 10 с Магнусом Виндингом", "text": "Главная причина демографического роста в беднейших регионах — отсутствие у женщин права выбора. Как только женщины получают образование и свободу распоряжаться своей жизнью, рождаемость закономерно падает."}, {"id": "con_edu_4", "title": "Логика «соединения точек» и проверка идей в диалоге", "desc": "Sheepilism and Agency; Разбор книги, ч. 1", "text": "Самообразование ценно не зубрежкой фактов, а умением «соединять точки по законам логики». При этом нужно избегать двух крайностей — догматизма и бесконечного скептицизма — и проверять свои мысли в диалоге с другим человеком, чтобы вовремя заметить ошибку."}]}, {"title": "2. Прямая демократия, политика и институты", "items": [{"id": "con_dem_1", "title": "Прямые референдумы и демократический мандат", "desc": "Подкаст № 7; Разбор Бенатара, ч. 2", "text": "Гэри выступает за прямую демократию без диктата лоббистов — вынос вопросов климата, субсидий на рождаемость и ответственного родительства на прямой референдум: «Получить мандат демократическим путём, когда большинство образованных граждан наконец осознает масштаб проблемы и проголосует за разумный, гуманный план»."}, {"id": "con_dem_2", "title": "Прозрачность судов, участие в выборах и «Fairness First»", "desc": "Голоса из думосферы; Разбор Бенатара, ч. 1–2", "text": "Гэри отвергает позицию «просто отойти в сторону» (всегда голосует, потому что между кандидатами есть разница), выступает за прозрачность судов с видеофиксацией и личной ответственностью, а также формулирует принцип партии «Справедливость прежде всего» (Fairness First): вознаграждение за полезный труд и ответственность за вред."}, {"id": "con_dem_3", "title": "Государство как обществе const STORAGE_KEYS = {
  favs: 'efilism_admin_favs_v1',
  custom: 'efilism_admin_custom_v1',
  theme: 'efilism_admin_theme_v1'
};

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) {
    return fallback;
  }
}
function saveJSON(key, val) {
  try {
    localStorage.setItem(key, JSON.stringify(val));
  } catch (e) {}
}

let state = {
  tab: 'quick',
  query: '',
  favOnly: false,
  allExpanded: false,
  favs: new Set(loadJSON(STORAGE_KEYS.favs, ['qr_what', 'qr_violence', 'mat_bundle_all', 'rose_book', 'rose_faq'])),
  customs: loadJSON(STORAGE_KEYS.custom, []),
  theme: loadJSON(STORAGE_KEYS.theme, 'dark')
};

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme);
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = state.theme === 'dark' ? '☀️' : '🌙';
}

let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1700);
}

function copyText(text, btnEl, label) {
  const done = () => {
    showToast(label || 'Скопировано в буфер');
    if (btnEl) {
      const orig = btnEl.textContent;
      btnEl.classList.add('btn-copied');
      btnEl.textContent = '✓ Скопировано';
      setTimeout(() => {
        btnEl.classList.remove('btn-copied');
        btnEl.textContent = orig;
      }, 1100);
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
  } else {
    fallbackCopy(text, done);
  }
}

function fallbackCopy(text, cb) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    cb();
  } catch (e) {
    showToast('Не удалось скопировать');
  }
}

function esc(s) {
  return String(s || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function countItems(groups) {
  return groups.reduce((acc, g) => acc + g.items.length, 0);
}

function updateCounts() {
  const cQuick = countItems(DATA.quick);
  const cMat = countItems(DATA.materials);
  const cRose = countItems(DATA.rose);
  const cFaq = countItems(DATA.faq);
  const cGary = countItems(DATA.gary);
  const cCon = countItems(DATA.constructive);
  const cCustom = state.customs.length;
  document.getElementById('cnt-quick').textContent = cQuick;
  document.getElementById('cnt-materials').textContent = cMat;
  document.getElementById('cnt-rose').textContent = cRose;
  document.getElementById('cnt-faq').textContent = cFaq;
  document.getElementById('cnt-gary').textContent = cGary;
  document.getElementById('cnt-constructive').textContent = cCon;
  document.getElementById('cnt-custom').textContent = cCustom;
  document.getElementById('favCount').textContent = state.favs.size;
  const total = cQuick + cMat + cRose + cFaq + cGary + cCon + cCustom;
  document.getElementById('totalStats').textContent = total + ' карточек · 1 клик = в буфере';
}

        preview: it.text.length > 140 ? it.text.slice(0, 137) + '…' : it.text,

        copyMain: 'Гэри (Inmendham), подкаст «Изучая антинатализм» № 7:\n' + it.quote,

function render() {
  updateCounts();
  const root = document.getElementById('contentRoot');
  const q = state.query.trim().toLowerCase();
  const isGlobalSearch = q.length > 0 || state.favOnly;

  let groups = [];
  if (isGlobalSearch) {
    const tabsOrder = [
      ['quick', '⚡ Быстрый ответ'],
      ['materials', '🔗 Материалы'],
      ['rose', '🤖 Rose'],
      ['faq', '❓ ЧаВо'],
      ['gary', '🎙 Гэри'],
      ['constructive', '🛠 Конструктив'],
      ['custom', '📌 Мои']
    ];
    tabsOrder.forEach(([tKey, prefix]) => {
      getNormalizedGroups(tKey).forEach(g => {
        const filtered = g.items.filter(it => {
          if (state.favOnly && !state.favs.has(it.id)) return false;
          if (q && !it.search.includes(q)) return false;
          return true;
        });
        if (filtered.length) {
          groups.push({ title: prefix + ' · ' + g.title, items: filtered });
        }
      });
    });
  } else {
    groups = getNormalizedGroups(state.tab);
  }

  const totalShown = countItems(groups);
  const statusEl = document.getElementById('statusLine');
  if (state.favOnly && q) {
    statusEl.textContent = '★ Избранное по запросу «' + state.query + '»: ' + totalShown;

    statusEl.textContent = '★ Избранные карточки: ' + totalShown;

          <div class="item-actions">
            <button type="button" class="btn btn-primary" data-action="copy-main" data-id="${esc(it.id)}">${esc(it.copyMainLabel)}</button>
            ${it.copyAlt ? `<button type="button" class="btn" data-action="copy-alt" data-id="${esc(it.id)}">${esc(it.copyAltLabel)}</button>` : ''}
            <button type="button" class="btn btn-ghost" data-action="toggle-text" data-id="${esc(it.id)}">Читать</button>
            ${it.openUrl ? `<a class="btn btn-ghost" href="${esc(it.openUrl)}" target="_blank" rel="noopener">↗</a>` : ''}
            ${it.isCustom ? `<button type="button" class="btn btn-danger" data-action="delete-custom" data-id="${esc(it.id)}">Удалить</button>` : ''}
          </div>
        </div>
      `;
    }).join('');
    return `
      <section class="group ${isOpen ? 'open' : ''}">
        <button type="button" class="group-head" data-action="toggle-group">
          <span class="group-head-left">
            <span>${esc(g.title)}</span>
          </span>
          <span style="display:inline-flex;align-items:center;gap:8px;">
            <span class="group-badge">${g.items.length}</span>
            <span class="chev">▼</span>
          </span>
        </button>
        <div class="group-body">${itemsHtml}</div>
      </section>
    `;
  }).join('');

  root.innerHTML = html;

  // Store item lookup map for click delegation
  window._CURRENT_ITEMS = {};
  groups.forEach(g => g.items.forEach(it => { window._CURRENT_ITEMS[it.id] = it; }));
}

// Event Delegation on Content Root
document.getElementById('contentRoot').addEventListener('click', (e) => {
  const groupBtn = e.target.closest('[data-action="toggle-group"]');
  if (groupBtn) {
    groupBtn.closest('.group').classList.toggle('open');
    return;
  }
  const actBtn = e.target.closest('[data-action]');
  if (!actBtn) return;
  const action = actBtn.getAttribute('data-action');
  const id = actBtn.getAttribute('data-id');
  const item = (window._CURRENT_ITEMS || {})[id];

  if (action === 'star') {
    if (state.favs.has(id)) {
      state.favs.delete(id);
      showToast('Убрано из избранного');
    } else {
      state.favs.add(id);
      showToast('Добавлено в ★ Избранное');
    }
    saveJSON(STORAGE_KEYS.favs, Array.from(state.favs));
    render();
    return;
  }
  if (action === 'copy-main' && item) {
    copyText(item.copyMain, actBtn, 'Скопировано: ' + (item.cmd || item.title.slice(0, 32)));
    return;
  }
  if (action === 'copy-alt' && item && item.copyAlt) {
    copyText(item.copyAlt, actBtn, 'Скопировано в буфер');
    return;
  }
  if (action === 'toggle-text') {
    const box = document.getElementById('exp-' + id);
    if (box) {
      const open = box.classList.toggle('open');
      actBtn.textContent = open ? 'Скрыть' : 'Читать';
    }
    return;
  }
  if (action === 'delete-custom') {
    state.customs = state.customs.filter(c => c.id !== id);
    state.favs.delete(id);
    saveJSON(STORAGE_KEYS.custom, state.customs);
    saveJSON(STORAGE_KEYS.favs, Array.from(state.favs));
    showToast('Шаблон удалён');
    render();
  }
});

// Tabs
document.getElementById('tabsNav').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  state.tab = btn.getAttribute('data-tab');
  state.favOnly = false;
  document.getElementById('favFilterBtn').classList.remove('active');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// Search
const searchInput = document.getElementById('searchInput');
const clearSearchBtn = document.getElementById('clearSearchBtn');
searchInput.addEventListener('input', () => {
  state.query = searchInput.value;
  clearSearchBtn.classList.toggle('visible', state.query.length > 0);
  render();
});
clearSearchBtn.addEventListener('click', () => {
  searchInput.value = '';
  state.query = '';
  clearSearchBtn.classList.remove('visible');
  render();
  searchInput.focus();
});

// Favorites Toggle
document.getElementById('favFilterBtn').addEventListener('click', () => {
  state.favOnly = !state.favOnly;
  document.getElementById('favFilterBtn').classList.toggle('active', state.favOnly);
  render();
});

// Expand/Collapse All
document.getElementById('toggleAllBtn').addEventListener('click', () => {
  state.allExpanded = !state.allExpanded;
  document.getElementById('toggleAllBtn').textContent = state.allExpanded ? 'Свернуть все' : 'Развернуть все';
  document.querySelectorAll('.group').forEach(g => g.classList.toggle('open', state.allExpanded));
});

// Theme Toggle
document.getElementById('themeBtn').addEventListener('click', () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  saveJSON(STORAGE_KEYS.theme, state.theme);
  applyTheme();
});

// Custom Snippet Modal
const modal = document.getElementById('customModal');
const titleInput = document.getElementById('customTitle');
const textInput = document.getElementById('customText');

function openModal() {
  titleInput.value = '';
  textInput.value = '';
  modal.classList.add('open');
  modal.setAttribute('aria-hidden', 'false');
  setTimeout(() => titleInput.focus(), 80);
}
function closeModal() {
  modal.classList.remove('open');
  modal.setAttribute('aria-hidden', 'true');
}
document.getElementById('addCustomBtn').addEventListener('click', openModal);
document.getElementById('closeModalBtn').addEventListener('click', closeModal);
document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => {
  if (e.target === modal) closeModal();
});
document.getElementById('saveCustomBtn').addEventListener('click', () => {
  const t = titleInput.value.trim();
  const body = textInput.value.trim();
  if (!t || !body) {
    showToast('Заполни заголовок и текст');
    return;
  }
  const newItem = { id: 'cust_' + Date.now(), title: t, text: body };
  state.customs.unshift(newItem);
  saveJSON(STORAGE_KEYS.custom, state.customs);
  closeModal();
  state.tab = 'custom';
  state.favOnly = false;
  document.getElementById('favFilterBtn').classList.remove('active');
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.getAttribute('data-tab') === 'custom'));
  showToast('Шаблон сохранён');
  render();
});

applyTheme();
render();
</script>
</body>
</html>
